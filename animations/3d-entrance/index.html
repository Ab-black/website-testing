<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Living gradient crossfade login and sign-up animation experiment.">
<title>Gradient Crossfade — Animation Lab</title>
<style>
:root{
  --bg:#0b0d10;--surface:#13171c;--raised:#1a1f26;--text:#f5f7fa;--muted:#9aa4b2;
  --border:rgba(255,255,255,.1);--accent:#fff;--accent-contrast:#0b0d10;
  --card:#f5f7fa;--card-secondary:#eef1f4;--card-neutral:#e9edf2;
  --card-text:#0b0d10;--card-muted:#66717f;--card-border:rgba(11,13,16,.1);
  --shadow:0 34px 90px rgba(0,0,0,.38),0 12px 30px rgba(0,0,0,.16);
  --radius:28px;--gradient-speed:10s;--fade:360ms;
}
*{box-sizing:border-box}
html{min-height:100%}
body{
  min-height:100vh;margin:0;display:grid;place-items:center;padding:32px 20px;
  background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.055),transparent 40%),var(--bg);
  color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input{font:inherit}
.page{width:min(100%,460px)}
.lab-label{margin:0 0 14px;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-align:center;text-transform:uppercase}
.scene{width:100%}
.card{
  position:relative;width:100%;display:grid;grid-template-areas:"stack";
  overflow:hidden;border:1px solid var(--card-border);border-radius:var(--radius);
  background:
    radial-gradient(circle at 18% 22%,var(--card) 0 14%,transparent 44%),
    linear-gradient(125deg,var(--card-neutral),var(--card-secondary),var(--card),var(--card-secondary),var(--card-neutral));
  background-size:150% 150%,300% 300%;
  animation:livingGradient var(--gradient-speed) linear infinite;
  box-shadow:var(--shadow);isolation:isolate;
}
.card:after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.72),inset 0 -1px 0 rgba(11,13,16,.04);
}
.face{
  grid-area:stack;position:relative;min-width:0;padding:clamp(30px,7vw,40px);
  opacity:1;transform:scale(1);pointer-events:none;
  transition:opacity var(--fade) ease,transform var(--fade) ease;
  z-index:1;
}
.face.is-hidden{opacity:0;transform:scale(.97)}
.face.is-active{opacity:1;transform:scale(1);pointer-events:auto;z-index:3}
.content-panel{
  position:relative;z-index:2;padding:0;
  border-radius:20px;
}
.brand-mark{
  width:46px;height:46px;display:grid;place-items:center;margin-bottom:30px;
  border:1px solid var(--card-border);border-radius:14px;background:rgba(255,255,255,.48);
  color:var(--card-text);font-size:.8rem;font-weight:800;letter-spacing:-.04em;
  box-shadow:0 10px 24px rgba(11,13,16,.08);
}
h1{margin:0 0 10px;color:var(--card-text);font-size:clamp(2rem,7vw,2.55rem);line-height:1.05;letter-spacing:-.045em}
.subtitle{margin:0 0 30px;color:var(--card-muted);font-size:.95rem;line-height:1.6}
.form{display:grid;gap:16px}
.field{display:grid;gap:8px}
.field label{
  color:var(--card-muted);font-size:.68rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase;
}
.input-wrap{position:relative}
.input-icon{display:none}
.field input{
  width:100%;height:50px;padding:0 15px;border:1px solid rgba(11,13,16,.1);border-radius:14px;outline:none;
  background:linear-gradient(135deg,rgba(245,247,250,.96),rgba(233,237,242,.96));
  color:var(--card-text);box-shadow:inset 0 2px 8px rgba(11,13,16,.12),inset 0 1px 0 rgba(255,255,255,.82);
  transition:border-color 180ms ease,box-shadow 180ms ease,background 180ms ease;
}
.field input::placeholder{color:#7a8490}
.field input:focus{
  border-color:rgba(11,13,16,.24);background:linear-gradient(135deg,#f8f9fa,#e9edf2);
  box-shadow:inset 0 2px 8px rgba(11,13,16,.1),0 0 0 4px rgba(11,13,16,.045);
}
.form-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
.remember{display:inline-flex;align-items:center;gap:8px;color:var(--card-muted);font-size:.78rem;cursor:pointer}
.remember input{width:15px;height:15px;accent-color:var(--accent-contrast)}
a{color:var(--card-text);font-size:.78rem;font-weight:650;text-decoration:none}
a:hover{text-decoration:underline}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.action{
  min-height:50px;border-radius:999px;padding:0 18px;cursor:pointer;font-weight:750;
  transition:transform 180ms ease,box-shadow 180ms ease,background 180ms ease,border-color 180ms ease;
}
.action:hover{transform:translateY(-1px)}
.action:active{transform:translateY(0)}
.primary{border:1px solid var(--accent-contrast);background:var(--accent-contrast);color:var(--card);box-shadow:0 12px 28px rgba(11,13,16,.16)}
.primary:hover{box-shadow:0 15px 32px rgba(11,13,16,.22)}
.secondary{border:1px solid rgba(11,13,16,.22);background:rgba(255,255,255,.5);color:var(--card-text)}
.secondary:hover{background:rgba(255,255,255,.76);border-color:rgba(11,13,16,.34)}
.switch-copy{margin:24px 0 0;color:var(--card-muted);font-size:.82rem;line-height:1.5;text-align:center}
.switch{padding:0;border:0;background:none;color:var(--card-text);cursor:pointer;font:inherit;font-weight:750;position:relative;z-index:10}
.switch:hover{text-decoration:underline}
.status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@keyframes livingGradient{
  0%{background-position:0% 50%,0% 50%}
  50%{background-position:100% 50%,100% 50%}
  100%{background-position:0% 50%,0% 50%}
}
@media(max-width:480px){
  body{padding:20px 14px}
  .face{padding:28px 22px}
  .action-row{gap:8px}
  .action{padding:0 12px;font-size:.88rem}
}
@media(prefers-reduced-motion:reduce){
  .card{animation:none}
  .face{transition:none}
  .action,.field input{transition:none}
}
</style>
</head>
<body>
<main class="page">
  <p class="lab-label">Animation Lab · Living Gradient</p>
  <div class="scene">
    <section class="card" id="authCard" aria-live="polite">
      <div class="face is-active" id="loginFace">
        <div class="content-panel">
          <div class="brand-mark" aria-hidden="true">VT</div>
          <h1>Login</h1>
          <p class="subtitle">Sign in to continue to your account.</p>
          <form class="form" id="loginForm">
            <div class="field">
              <label for="loginEmail">Email address</label>
              <div class="input-wrap"><span class="input-icon" aria-hidden="true">✉</span><input id="loginEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email"></div>
            </div>
            <div class="field">
              <label for="loginPassword">Password</label>
              <div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password"></div>
            </div>
            <div class="form-row">
              <label class="remember"><input id="rememberMe" type="checkbox">Remember me</label>
              <a href="#forgot-password">Forgot password?</a>
            </div>
            <div class="action-row">
              <button class="action primary" type="submit">Sign In</button>
              <button class="action secondary" id="showSignup" type="button">Create Account</button>
            </div>
          </form>
          <p class="switch-copy">New here? Use Create Account above.</p>
        </div>
      </div>

      <div class="face is-hidden" id="signupFace">
        <div class="content-panel">
          <div class="brand-mark" aria-hidden="true">VT</div>
          <h1>Sign up</h1>
          <p class="subtitle">Create your account and get started.</p>
          <form class="form" id="signupForm">
            <div class="field">
              <label for="signupName">Full name</label>
              <div class="input-wrap"><span class="input-icon" aria-hidden="true">◉</span><input id="signupName" name="name" type="text" placeholder="Your full name" autocomplete="name"></div>
            </div>
            <div class="field">
              <label for="signupEmail">Email address</label>
              <div class="input-wrap"><span class="input-icon" aria-hidden="true">✉</span><input id="signupEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email"></div>
            </div>
            <div class="field">
              <label for="signupPassword">Password</label>
              <div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="signupPassword" name="password" type="password" placeholder="Create a password" autocomplete="new-password"></div>
            </div>
            <div class="action-row">
              <button class="action primary" type="submit">Create Account</button>
              <button class="action secondary" id="showLogin" type="button">Log In</button>
            </div>
          </form>
          <p class="switch-copy">Already have an account? Use Log In above.</p>
        </div>
      </div>
    </section>
  </div>
  <p class="status" id="status" aria-live="polite">Login form is active.</p>
</main>
<script>
(()=>{
  const card=document.getElementById("authCard");
  const loginFace=document.getElementById("loginFace");
  const signupFace=document.getElementById("signupFace");
  const showSignup=document.getElementById("showSignup");
  const showLogin=document.getElementById("showLogin");
  const status=document.getElementById("status");
  const loginForm=document.getElementById("loginForm");
  const signupForm=document.getElementById("signupForm");
  const reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)");
  const fadeDuration=360;
  let isSignUpVisible=false;
  let isSwitching=false;

  function renderVisibleSide(){
    loginFace.classList.toggle("is-active",!isSignUpVisible);
    loginFace.classList.toggle("is-hidden",isSignUpVisible);
    signupFace.classList.toggle("is-active",isSignUpVisible);
    signupFace.classList.toggle("is-hidden",!isSignUpVisible);
    status.textContent=isSignUpVisible?"Sign-up form is active.":"Login form is active.";
  }

  function setAuthSide(next){
    if(isSwitching || next===isSignUpVisible)return;
    isSignUpVisible=next;
    isSwitching=true;

    const outgoing=isSignUpVisible?loginFace:signupFace;
    const incoming=isSignUpVisible?signupFace:loginFace;

    outgoing.classList.remove("is-active");
    outgoing.classList.add("is-hidden");

    const reveal=()=>{
      renderVisibleSide();
      requestAnimationFrame(()=>{
        incoming.classList.remove("is-hidden");
        incoming.classList.add("is-active");
      });
      if(reducedMotion.matches){
        isSwitching=false;
        return;
      }
      window.setTimeout(()=>{isSwitching=false},fadeDuration);
    };

    if(reducedMotion.matches){
      reveal();
    }else{
      window.setTimeout(reveal,fadeDuration);
    }
  }

  showSignup.addEventListener("click",()=>setAuthSide(true));
  showLogin.addEventListener("click",()=>setAuthSide(false));
  loginForm.addEventListener("submit",e=>e.preventDefault());
  signupForm.addEventListener("submit",e=>e.preventDefault());
})();
</script>
</body>
</html>
