<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Double Doors — Animation Lab</title>
<style>
:root{--bg:#0b0d10;--surface:#13171c;--raised:#1a1f26;--text:#f5f7fa;--muted:#9aa4b2;--border:rgba(255,255,255,.1);--accent:#fff;--accent-contrast:#0b0d10;--duration:850ms;--shadow:0 30px 80px rgba(0,0,0,.42);--radius:24px}
*{box-sizing:border-box}html{min-height:100%}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:32px 20px;background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.055),transparent 40%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.page{width:min(100%,460px)}.lab-label{margin:0 0 14px;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-align:center;text-transform:uppercase}.doors-wrap{width:100%;perspective:1500px}.entrance{position:relative;width:100%;display:grid;transform-style:preserve-3d}.room,.door{grid-area:1/1;position:relative;min-width:0;padding:clamp(28px,7vw,40px);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}.room{z-index:1;background:linear-gradient(145deg,rgba(255,255,255,.045),transparent 38%),var(--surface);box-shadow:var(--shadow);pointer-events:none}.door{z-index:3;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.01) 55%,rgba(0,0,0,.08)),linear-gradient(90deg,var(--raised),var(--surface));box-shadow:var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform var(--duration) ease-in-out,opacity var(--duration) ease-in-out,box-shadow var(--duration) ease-in-out}.door:before{content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.07);border-radius:calc(var(--radius) - 8px);pointer-events:none}.door-left{transform-origin:left center;clip-path:inset(0 50% 0 0 round var(--radius));}.door-right{transform-origin:right center;clip-path:inset(0 0 0 50% round var(--radius));}.door-content{position:relative;z-index:2;width:50%;height:100%;display:flex;flex-direction:column;justify-content:center}.door-left .door-content{margin-left:0;padding-right:12px}.door-right .door-content{margin-left:50%;padding-left:12px}.entrance.is-open .door-left{transform:rotateY(-112deg);opacity:.2;box-shadow:-30px 28px 65px rgba(0,0,0,.5)}.entrance.is-open .door-right{transform:rotateY(112deg);opacity:.2;box-shadow:30px 28px 65px rgba(0,0,0,.5)}.door-handle{position:absolute;top:50%;width:10px;height:10px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:var(--raised);box-shadow:0 0 0 5px rgba(255,255,255,.025);transform:translateY(-50%);pointer-events:none}.door-left .door-handle{right:18px}.door-right .door-handle{left:18px}.content{position:relative;z-index:4}.brand-mark{width:46px;height:46px;display:grid;place-items:center;margin-bottom:30px;border:1px solid var(--border);border-radius:14px;background:var(--raised);color:var(--text);font-size:.8rem;font-weight:800;letter-spacing:-.04em}h1{margin:0 0 10px;font-size:clamp(2rem,7vw,2.55rem);line-height:1.05;letter-spacing:-.045em}.subtitle{margin:0 0 30px;color:var(--muted);font-size:.95rem;line-height:1.6}.form{display:grid;gap:16px}.field{display:grid;gap:8px}.field label{color:var(--text);font-size:.78rem;font-weight:650}.input-wrap{position:relative}.input-icon{position:absolute;top:50%;left:15px;width:18px;height:18px;display:grid;place-items:center;color:var(--muted);font-size:.88rem;pointer-events:none;transform:translateY(-50%)}.field input{width:100%;height:50px;padding:0 15px 0 44px;border:1px solid var(--border);border-radius:14px;outline:none;background:rgba(255,255,255,.035);color:var(--text);transition:border-color 180ms ease,background 180ms ease,box-shadow 180ms ease}.field input::placeholder{color:#6f7987}.field input:focus{border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.055);box-shadow:0 0 0 4px rgba(255,255,255,.055)}.form-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}.remember{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.78rem;cursor:pointer}.remember input{width:15px;height:15px;accent-color:var(--accent)}a{color:var(--text);font-size:.78rem;font-weight:650;text-decoration:none}a:hover{text-decoration:underline}.primary{width:100%;min-height:50px;margin-top:8px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-contrast);cursor:pointer;font-weight:750;transition:transform 180ms ease,box-shadow 180ms ease}.primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(0,0,0,.2)}.primary:active{transform:translateY(0)}.switch-copy{margin:34px 0 0;color:var(--muted);font-size:.82rem;line-height:1.5;text-align:center}.switch{position:relative;z-index:8;margin-left:4px;padding:0;border:0;background:none;color:var(--text);cursor:pointer;font:inherit;font-weight:750}.switch:hover{text-decoration:underline}.room .switch{z-index:10}.sr-status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.room .content{z-index:6}.room .switch{pointer-events:auto}.room{transition:none}.entrance.is-open .room{pointer-events:auto}.entrance:not(.is-open) .room{pointer-events:none}.entrance:not(.is-open) .door{pointer-events:auto}.entrance.is-open .door{pointer-events:none}
@media(max-width:480px){body{padding:20px 14px}.room,.door{padding:28px 22px}.door-left .door-content{padding-right:8px}.door-right .door-content{padding-left:8px}.door-left .door-handle{right:12px}.door-right .door-handle{left:12px}}
@media(prefers-reduced-motion:reduce){.door{transition-duration:1ms}.field input,.primary{transition:none}}
</style>
</head>
<body>
<main class="page">
<p class="lab-label">Animation Lab · Double Doors</p>
<div class="doors-wrap">
<section class="entrance" id="entrance" aria-live="polite">
<div class="room">
<div class="content">
<div class="brand-mark" aria-hidden="true">VT</div>
<h1>Sign up</h1><p class="subtitle">Create your account and get started.</p>
<form class="form" id="signupForm">
<div class="field"><label for="signupName">Full name</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="signupName" name="name" type="text" placeholder="Your full name" autocomplete="name"></div></div>
<div class="field"><label for="signupEmail">Email address</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">✉</span><input id="signupEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email"></div></div>
<div class="field"><label for="signupPassword">Password</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="signupPassword" name="password" type="password" placeholder="Create a password" autocomplete="new-password"></div></div>
<button class="primary" type="submit">Sign Up</button>
</form>
<p class="switch-copy">Already have an account?<button class="switch" id="showLogin" type="button">Log in</button></p>
</div>
</div>
<div class="door door-left">
<span class="door-handle" aria-hidden="true"></span>
<div class="door-content" aria-hidden="true"></div>
</div>
<div class="door door-right">
<span class="door-handle" aria-hidden="true"></span>
<div class="door-content" aria-hidden="true"></div>
</div>
<div class="content" id="loginContent">
<div class="brand-mark" aria-hidden="true">VT</div>
<h1>Login</h1><p class="subtitle">Sign in to continue to your account.</p>
<form class="form" id="loginForm">
<div class="field"><label for="loginEmail">Email address</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">✉</span><input id="loginEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email"></div></div>
<div class="field"><label for="loginPassword">Password</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password"></div></div>
<div class="form-row"><label class="remember"><input id="rememberMe" type="checkbox">Remember me</label><a href="#forgot-password">Forgot password?</a></div>
<button class="primary" type="submit">Sign In</button>
</form>
<p class="switch-copy">Don't have an account?<button class="switch" id="showSignup" type="button">Sign up</button></p>
</div>
</section>
</div>
<p class="sr-status" id="status" aria-live="polite">Login form is active.</p>
</main>
<script>
(()=>{const entrance=document.getElementById("entrance"),showSignup=document.getElementById("showSignup"),showLogin=document.getElementById("showLogin"),status=document.getElementById("status"),loginForm=document.getElementById("loginForm"),signupForm=document.getElementById("signupForm");let isSignUpVisible=false;let isTurning=false;const duration=850;function toggleDoors(){if(isTurning)return;isSignUpVisible=!isSignUpVisible;isTurning=true;entrance.classList.toggle("is-open",isSignUpVisible);status.textContent=isSignUpVisible?"Sign-up form is active.":"Login form is active.";window.setTimeout(()=>{isTurning=false},duration+30)}showSignup.addEventListener("click",toggleDoors);showLogin.addEventListener("click",toggleDoors);loginForm.addEventListener("submit",e=>e.preventDefault());signupForm.addEventListener("submit",e=>e.preventDefault())})();
</script>
</body>
</html>
