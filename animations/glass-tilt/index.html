<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Glassmorphism login card with cursor tilt and parallax animation experiment.">
<title>Glass Tilt — Animation Lab</title>
<style>
:root{
  --bg:#0b0d10;--surface:#13171c;--raised:#1a1f26;--text:#f5f7fa;
  --muted:#9aa4b2;--border:rgba(255,255,255,.1);--accent:#fff;
  --accent-contrast:#0b0d10;--glass:rgba(19,23,28,.58);
  --glass-border:rgba(255,255,255,.18);--shadow:0 30px 90px rgba(0,0,0,.42);
  --radius:24px;--tilt-duration:450ms;
}
*{box-sizing:border-box}
html{min-height:100%}
body{
  min-height:100vh;margin:0;display:grid;place-items:center;overflow:auto;
  padding:32px 20px;background:var(--bg);color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input{font:inherit}
.page{width:min(100%,460px)}
.lab-label{
  margin:0 0 14px;color:var(--muted);font-size:.72rem;font-weight:700;
  letter-spacing:.14em;text-align:center;text-transform:uppercase;
}
.scene{position:relative;width:100%;perspective:1000px;isolation:isolate}
.orb{
  position:absolute;border-radius:50%;filter:blur(48px);pointer-events:none;
  opacity:.18;will-change:transform;z-index:-1;transition:transform 500ms ease-out;
}
.orb-one{width:250px;height:250px;left:-100px;top:-90px;background:var(--accent)}
.orb-two{width:210px;height:210px;right:-80px;top:150px;background:var(--muted)}
.orb-three{width:230px;height:230px;left:90px;bottom:-130px;background:var(--accent)}
.glass-card{
  position:relative;width:100%;padding:clamp(30px,7vw,44px);
  border:1px solid var(--glass-border);border-radius:var(--radius);
  background:
    linear-gradient(145deg,rgba(255,255,255,.08),transparent 42%),
    var(--glass);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08);
  transform:rotateX(0deg) rotateY(0deg);transform-style:preserve-3d;
  will-change:transform;transition:transform var(--tilt-duration) cubic-bezier(.2,.75,.25,1);
}
.glass-card:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.07),transparent 28%,transparent 72%,rgba(255,255,255,.025));
  border-radius:inherit;
}
.glass-card:after{
  content:"";position:absolute;width:180px;height:180px;right:-100px;top:-110px;
  border:1px solid rgba(255,255,255,.08);border-radius:50%;pointer-events:none;
}
.content{position:relative;z-index:2}
.form-view[hidden]{display:none}
.brand-mark{
  width:46px;height:46px;display:grid;place-items:center;margin-bottom:30px;
  border:1px solid var(--border);border-radius:14px;background:rgba(26,31,38,.5);
  color:var(--text);font-size:.8rem;font-weight:800;letter-spacing:-.04em;
  box-shadow:0 10px 30px rgba(0,0,0,.14);
}
h1{margin:0 0 10px;font-size:clamp(2rem,7vw,2.55rem);line-height:1.05;letter-spacing:-.045em}
.subtitle{margin:0 0 30px;color:var(--muted);font-size:.95rem;line-height:1.6}
.form{display:grid;gap:16px}
.field{display:grid;gap:8px}
.field label{color:var(--text);font-size:.78rem;font-weight:650}
.input-wrap{position:relative}
.input-icon{
  position:absolute;top:50%;left:15px;width:18px;height:18px;display:grid;place-items:center;
  color:var(--muted);font-size:.88rem;pointer-events:none;transform:translateY(-50%);
}
.field input{
  width:100%;height:50px;padding:0 15px 0 44px;border:1px solid var(--border);
  border-radius:14px;outline:none;background:rgba(11,13,16,.24);color:var(--text);
  transition:border-color 180ms ease,background 180ms ease,box-shadow 180ms ease;
}
.field input::placeholder{color:#6f7987}
.field input:focus{
  border-color:rgba(255,255,255,.32);background:rgba(11,13,16,.32);
  box-shadow:0 0 0 4px rgba(255,255,255,.055);
}
.form-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
.remember{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.78rem;cursor:pointer}
.remember input{width:15px;height:15px;accent-color:var(--accent)}
a{color:var(--text);font-size:.78rem;font-weight:650;text-decoration:none}
a:hover{text-decoration:underline}
.primary{
  width:100%;min-height:50px;margin-top:8px;border:0;border-radius:14px;
  background:var(--accent);color:var(--accent-contrast);cursor:pointer;font-weight:750;
  transition:transform 180ms ease,box-shadow 180ms ease;
  box-shadow:0 12px 28px rgba(0,0,0,.16);
}
.primary:hover{transform:translateY(-1px);box-shadow:0 15px 32px rgba(0,0,0,.22)}
.primary:active{transform:translateY(0)}
.switch-copy{
  margin:34px 0 0;color:var(--muted);font-size:.82rem;line-height:1.5;text-align:center;
}
.switch{
  margin-left:4px;padding:0;border:0;background:none;color:var(--text);
  cursor:pointer;font:inherit;font-weight:750;position:relative;z-index:3;
}
.switch:hover{text-decoration:underline}
.sr-status{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
@media(max-width:480px){
  body{padding:20px 14px}
  .glass-card{padding:28px 22px}
  .orb{filter:blur(42px)}
  .orb-one{width:190px;height:190px;left:-90px;top:-60px}
  .orb-two{width:170px;height:170px;right:-80px;top:170px}
  .orb-three{width:180px;height:180px;left:70px;bottom:-100px}
}
@media(prefers-reduced-motion:reduce){
  .glass-card{transition:none;transform:none!important}
  .orb{transition:none;transform:none!important}
  .field input,.primary{transition:none}
}
</style>
</head>
<body>
<main class="page">
<p class="lab-label">Animation Lab · Glass Tilt</p>
<div class="scene" id="scene">
  <span class="orb orb-one" aria-hidden="true"></span>
  <span class="orb orb-two" aria-hidden="true"></span>
  <span class="orb orb-three" aria-hidden="true"></span>

  <section class="glass-card" id="glassCard" aria-live="polite">
    <div class="content">
      <div class="brand-mark" aria-hidden="true">VT</div>

      <section class="form-view" id="loginView" aria-label="Login">
        <h1>Login</h1>
        <p class="subtitle">Sign in to continue to your account.</p>
        <form class="form" id="loginForm">
          <div class="field">
            <label for="loginEmail">Email address</label>
            <div class="input-wrap"><span class="input-icon" aria-hidden="true">✉</span><input id="loginEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email"></div>
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password"></div>
          </div>
          <div class="form-row">
            <label class="remember"><input id="rememberMe" type="checkbox">Remember me</label>
            <a href="#forgot-password">Forgot password?</a>
          </div>
          <button class="primary" type="submit">Sign In</button>
        </form>
        <p class="switch-copy">Don't have an account?<button class="switch" id="showSignup" type="button">Sign up</button></p>
      </section>

      <section class="form-view" id="signupView" aria-label="Sign up" hidden>
        <h1>Sign up</h1>
        <p class="subtitle">Create your account and get started.</p>
        <form class="form" id="signupForm">
          <div class="field">
            <label for="signupName">Full name</label>
            <div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="signupName" name="name" type="text" placeholder="Your full name" autocomplete="name"></div>
          </div>
          <div class="field">
            <label for="signupEmail">Email address</label>
            <div class="input-wrap"><span class="input-icon" aria-hidden="true">✉</span><input id="signupEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email"></div>
          </div>
          <div class="field">
            <label for="signupPassword">Password</label>
            <div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="signupPassword" name="password" type="password" placeholder="Create a password" autocomplete="new-password"></div>
          </div>
          <button class="primary" type="submit">Sign Up</button>
        </form>
        <p class="switch-copy">Already have an account?<button class="switch" id="showLogin" type="button">Log in</button></p>
      </section>
    </div>
  </section>
</div>
<p class="sr-status" id="status" aria-live="polite">Login form is active.</p>
</main>

<script>
(()=>{
  const scene=document.getElementById("scene");
  const card=document.getElementById("glassCard");
  const loginView=document.getElementById("loginView");
  const signupView=document.getElementById("signupView");
  const showSignup=document.getElementById("showSignup");
  const showLogin=document.getElementById("showLogin");
  const status=document.getElementById("status");
  const loginForm=document.getElementById("loginForm");
  const signupForm=document.getElementById("signupForm");
  const orbs=[...document.querySelectorAll(".orb")];
  const reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)");
  let isSignUpVisible=false;

  function setAuthSide(next){
    isSignUpVisible=next;
    loginView.hidden=isSignUpVisible;
    signupView.hidden=!isSignUpVisible;
    status.textContent=isSignUpVisible?"Sign-up form is active.":"Login form is active.";
  }

  function resetMotion(){
    card.style.transform="rotateX(0deg) rotateY(0deg)";
    orbs.forEach(orb=>orb.style.transform="translate3d(0,0,0)");
  }

  showSignup.addEventListener("click",()=>setAuthSide(true));
  showLogin.addEventListener("click",()=>setAuthSide(false));
  loginForm.addEventListener("submit",e=>e.preventDefault());
  signupForm.addEventListener("submit",e=>e.preventDefault());

  if(!reducedMotion.matches){
    scene.addEventListener("mousemove",e=>{
      const rect=card.getBoundingClientRect();
      const x=Math.max(-1,Math.min(1,(e.clientX-(rect.left+rect.width/2))/(rect.width/2)));
      const y=Math.max(-1,Math.min(1,(e.clientY-(rect.top+rect.height/2))/(rect.height/2)));
      const rotateX=-y*8;
      const rotateY=x*8;

      card.style.transform=`rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

      const speeds=[3,6,9];
      orbs.forEach((orb,index)=>{
        orb.style.transform=`translate3d(${x*speeds[index]}px,${y*speeds[index]}px,0)`;
      });
    });

    scene.addEventListener("mouseleave",resetMotion);
  }

  reducedMotion.addEventListener?.("change",event=>{
    if(event.matches) resetMotion();
  });
})();
</script>
</body>
</html>
