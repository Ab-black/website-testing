<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Shutter-style login and sign-up transition animation experiment.">
<title>Shutter Login — Animation Lab</title>
<style>
:root{
  --bg:#0b0d10;--surface:#13171c;--raised:#1a1f26;--text:#f5f7fa;--muted:#9aa4b2;
  --border:rgba(255,255,255,.1);--accent:#fff;--accent-contrast:#0b0d10;
  --card:#f5f7fa;--card-soft:#eef1f4;--card-tint:#e9edf2;--card-text:#0b0d10;--card-muted:#66717f;
  --card-border:rgba(11,13,16,.1);--shadow:0 38px 96px rgba(0,0,0,.38),0 14px 34px rgba(0,0,0,.16);
  --slat-duration:300ms;--slat-stagger:50ms;--radius:28px;
}
*{box-sizing:border-box}
html{min-height:100%}
body{
  min-height:100vh;margin:0;display:grid;place-items:center;padding:32px 20px;
  background:
    radial-gradient(circle at 50% 48%,rgba(255,255,255,.045),transparent 42%),
    var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input{font:inherit}
.page{width:min(100%,460px)}.lab-label{margin:0 0 16px;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-align:center;text-transform:uppercase}.scene{width:100%;perspective:1200px;perspective-origin:50% 50%}
.card{position:relative;width:100%;display:grid;grid-template-areas:"stack";border:1px solid var(--card-border);border-radius:var(--radius);background:linear-gradient(145deg,var(--card),var(--card-soft) 55%,var(--card-tint));box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.82);overflow:hidden}
.panel{grid-area:stack;min-width:0;position:relative;padding:clamp(32px,7vw,42px);background:linear-gradient(145deg,rgba(255,255,255,.35),rgba(233,237,242,.22)),linear-gradient(145deg,var(--card),var(--card-soft) 55%,var(--card-tint));}.panel-login{z-index:1}.panel-signup{z-index:1}.panel.is-hidden{visibility:hidden;pointer-events:none}.panel.is-active{visibility:visible;pointer-events:auto}.content{position:relative;z-index:2}
.brand-mark{width:46px;height:46px;display:grid;place-items:center;margin-bottom:30px;border:1px solid var(--card-border);border-radius:14px;background:var(--card-tint);color:var(--card-text);font-size:.8rem;font-weight:800;letter-spacing:-.04em;box-shadow:0 10px 24px rgba(11,13,16,.08)}h1{
  margin:0 0 10px;font-size:clamp(2rem,7vw,2.55rem);
  line-height:1.05;letter-spacing:-.045em;
}
.subtitle{margin:0 0 30px;color:var(--muted);font-size:.95rem;line-height:1.6}
.form{display:grid;gap:16px}
.field{display:grid;gap:8px}.field label{color:var(--card-muted);font-size:.68rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase}.input-wrap{position:relative}.input-icon{display:none}.field input{width:100%;height:50px;padding:0 14px;border:1px solid var(--card-border);border-radius:14px;outline:none;background:linear-gradient(135deg,rgba(245,247,250,.98),rgba(233,237,242,.98));color:var(--card-text);box-shadow:inset 0 2px 8px rgba(11,13,16,.12),inset 0 1px 0 rgba(255,255,255,.82);transition:border-color 180ms ease,background 180ms ease,box-shadow 180ms ease}
.field input::placeholder{color:#7a8490}.field input:focus{border-color:rgba(11,13,16,.24);background:linear-gradient(135deg,#f8f9fa,#e9edf2);box-shadow:inset 0 2px 8px rgba(11,13,16,.1),0 0 0 4px rgba(11,13,16,.045)}
.form-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-top:2px;
}
.remember{
  display:inline-flex;align-items:center;gap:8px;
  color:var(--muted);font-size:.78rem;cursor:pointer;
}
.remember input{width:15px;height:15px;accent-color:var(--accent)}
a{
  color:var(--text);font-size:.78rem;font-weight:650;text-decoration:none;
}
a:hover{text-decoration:underline}
.primary{width:100%;min-height:50px;margin-top:8px;border:1px solid var(--accent-contrast);border-radius:999px;background:var(--accent-contrast);color:var(--card);cursor:pointer;font-weight:750;transition:transform 180ms ease,box-shadow 180ms ease}.primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(11,13,16,.18)}.primary:active{transform:translateY(0)}
.switch-copy{
  margin:40px 0 0;color:var(--muted);
  font-size:.82rem;line-height:1.5;text-align:center;
}
.switch{margin-left:4px;padding:7px 13px;border:1px solid rgba(11,13,16,.22);border-radius:999px;background:rgba(255,255,255,.52);color:var(--card-text);cursor:pointer;font:inherit;font-weight:750;position:relative;z-index:30}.switch:hover{text-decoration:underline;background:rgba(255,255,255,.78)}

/* Shutter overlay: seven seamless, independently rotating vertical slats. */
.shutter{position:absolute;inset:0;z-index:20;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));pointer-events:none;perspective:1200px;overflow:hidden}
.slat{position:relative;min-width:0;height:100%;margin-right:-1px;transform:rotateY(90deg);transform-origin:50% 50%;transform-style:preserve-3d;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:0;outline:0;background-image:linear-gradient(145deg,var(--accent-contrast) 0%,var(--raised) 38%,var(--card-soft) 70%,var(--surface) 100%);background-size:700% 100%;background-repeat:no-repeat;box-shadow:none;transition:transform var(--slat-duration) ease-in-out;will-change:transform}
.slat:nth-child(1){background-position:0% 0}.slat:nth-child(2){background-position:16.666% 0}.slat:nth-child(3){background-position:33.333% 0}.slat:nth-child(4){background-position:50% 0}.slat:nth-child(5){background-position:66.666% 0}.slat:nth-child(6){background-position:83.333% 0}.slat:nth-child(7){background-position:100% 0}
.slat::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);opacity:.55;pointer-events:none}
.card.is-closing .slat,.card.is-opening .slat{transform:rotateY(0deg)}
.card.is-opening .slat{transform:rotateY(90deg)}
.card.is-closing .slat:nth-child(1),.card.is-opening .slat:nth-child(1){transition-delay:0ms}
.card.is-closing .slat:nth-child(2),.card.is-opening .slat:nth-child(2){transition-delay:50ms}
.card.is-closing .slat:nth-child(3),.card.is-opening .slat:nth-child(3){transition-delay:100ms}
.card.is-closing .slat:nth-child(4),.card.is-opening .slat:nth-child(4){transition-delay:150ms}
.card.is-closing .slat:nth-child(5),.card.is-opening .slat:nth-child(5){transition-delay:200ms}
.card.is-closing .slat:nth-child(6),.card.is-opening .slat:nth-child(6){transition-delay:250ms}
.card.is-closing .slat:nth-child(7),.card.is-opening .slat:nth-child(7){transition-delay:300ms}

.status{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

@media(max-width:560px){
  body{padding:20px 14px}
  .panel{padding:28px 22px}
}
@media(max-width:380px){
  .panel{padding:26px 20px}
  .form-row{align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){
  .slat{transition:none!important}
  .card.is-closing .slat{transform:rotateY(0deg)}
  .card.is-opening .slat{transform:rotateY(90deg)}
  .field input,.primary{transition:none}
}
</style>
</head>
<body>
<main class="page">
  <p class="lab-label">Animation Lab · Shutter Login</p>

  <div class="scene">
    <section class="card" id="authCard" aria-live="polite">
      <div class="panel panel-login is-active" id="loginPanel">
        <div class="content">
          <div class="brand-mark" aria-hidden="true">VT</div>
          <h1>Login</h1>
          <p class="subtitle">Sign in to continue to your account.</p>

          <form class="form" id="loginForm">
            <div class="field">
              <label for="loginEmail">Email address</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">✉</span>
                <input id="loginEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email">
              </div>
            </div>

            <div class="field">
              <label for="loginPassword">Password</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">●</span>
                <input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password">
              </div>
            </div>

            <div class="form-row">
              <label class="remember"><input id="rememberMe" type="checkbox">Remember me</label>
              <a href="#forgot-password">Forgot password?</a>
            </div>

            <button class="primary" type="submit">Sign In</button>
          </form>

          <p class="switch-copy">
            Don't have an account?
            <button class="switch" id="showSignup" type="button">Sign up</button>
          </p>
        </div>
      </div>

      <div class="panel panel-signup is-hidden" id="signupPanel">
        <div class="content">
          <div class="brand-mark" aria-hidden="true">VT</div>
          <h1>Sign up</h1>
          <p class="subtitle">Create an account and get started.</p>

          <form class="form" id="signupForm">
            <div class="field">
              <label for="signupName">Full name</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">◉</span>
                <input id="signupName" name="name" type="text" placeholder="Your full name" autocomplete="name">
              </div>
            </div>

            <div class="field">
              <label for="signupEmail">Email address</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">✉</span>
                <input id="signupEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email">
              </div>
            </div>

            <div class="field">
              <label for="signupPassword">Password</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">●</span>
                <input id="signupPassword" name="password" type="password" placeholder="Create a password" autocomplete="new-password">
              </div>
            </div>

            <button class="primary" type="submit">Create Account</button>
          </form>

          <p class="switch-copy">
            Already have an account?
            <button class="switch" id="showLogin" type="button">Log in</button>
          </p>
        </div>
      </div>

      <div class="shutter" id="shutter" aria-hidden="true">
        <span class="slat"></span>
        <span class="slat"></span>
        <span class="slat"></span>
        <span class="slat"></span>
        <span class="slat"></span>
        <span class="slat"></span>
        <span class="slat"></span>
      </div>
    </section>
  </div>

  <p class="status" id="status" aria-live="polite">Login form is active.</p>
</main>

<script>
(()=>{
  const card=document.getElementById("authCard");
  const loginPanel=document.getElementById("loginPanel");
  const signupPanel=document.getElementById("signupPanel");
  const showSignup=document.getElementById("showSignup");
  const showLogin=document.getElementById("showLogin");
  const status=document.getElementById("status");
  const slats=[...document.querySelectorAll(".slat")];
  const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)");

  const slatDuration=300;
  const slatStagger=50;
  const total=slatDuration+(slats.length-1)*slatStagger;
  let isSignUpVisible=false;
  let isAnimating=false;

  function setActivePanel(signup){
    loginPanel.classList.toggle("is-active",!signup);
    loginPanel.classList.toggle("is-hidden",signup);
    signupPanel.classList.toggle("is-active",signup);
    signupPanel.classList.toggle("is-hidden",!signup);
  }

  function finishTransition(){
    card.classList.remove("is-closing","is-opening");
    setActivePanel(isSignUpVisible);
    isAnimating=false;
  }

  function toggleAuth(){
    if(isAnimating)return;

    const nextState=!isSignUpVisible;
    isAnimating=true;

    // Close the shutters over the currently visible form.
    card.classList.remove("is-opening");
    void card.offsetWidth;
    card.classList.add("is-closing");

    const swapAt=reduceMotion.matches ? 0 : total;

    setTimeout(()=>{
      // At this exact point the final slat has reached 0deg and fully
      // covers the card, so the underlying content can be swapped unseen.
      isSignUpVisible=nextState;
      setActivePanel(isSignUpVisible);
      status.textContent=isSignUpVisible
        ? "Sign-up form is active."
        : "Login form is active.";

      card.classList.remove("is-closing");
      void card.offsetWidth;
      card.classList.add("is-opening");

      if(reduceMotion.matches){
        finishTransition();
      }else{
        setTimeout(finishTransition,total);
      }
    },swapAt);
  }

  showSignup.addEventListener("click",toggleAuth);
  showLogin.addEventListener("click",toggleAuth);

  document.querySelectorAll("form").forEach(form=>{
    form.addEventListener("submit",event=>event.preventDefault());
  });

  // Keep both panels in layout so the card height follows whichever
  // form needs more room, while only the active panel receives pointer input.
  setActivePanel(false);
})();
</script>
</body>
</html>
