<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Light-refraction shimmer login and sign-up animation experiment.">
<title>Refraction Shimmer — Animation Lab</title>
<style>
:root{
  --bg:#0b0d10;
  --surface:#13171c;
  --raised:#1a1f26;
  --text:#f5f7fa;
  --muted:#9aa4b2;
  --border:rgba(255,255,255,.1);
  --accent:#fff;
  --accent-contrast:#0b0d10;
  --shadow:0 30px 80px rgba(0,0,0,.42);
  --radius:24px;
  --morph:720ms;
  --shimmer:520ms;
}
*{box-sizing:border-box}
html{min-height:100%}
body{
  min-height:100vh;margin:0;display:grid;place-items:center;padding:32px 20px;
  background:radial-gradient(circle at 50% 48%,rgba(255,255,255,.045),transparent 42%),var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
}
button,input{font:inherit}
.page{width:min(100%,460px)}
.lab-label{margin:0 0 14px;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-align:center;text-transform:uppercase}
.scene{width:100%;perspective:1200px;perspective-origin:50% 50%}
.card{
  position:relative;width:100%;min-height:610px;
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.045);
  transform-style:preserve-3d;
  transition:transform var(--morph) ease-in-out,box-shadow var(--morph) ease-in-out;
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background:linear-gradient(120deg,rgba(255,255,255,.055),transparent 32%,transparent 70%,rgba(255,255,255,.018));
}
.shimmer{
  position:absolute;
  z-index:10;
  top:-45%;
  left:-75%;
  width:48%;
  height:190%;
  pointer-events:none;
  opacity:0;
  transform:translateX(-120%) rotate(24deg);
  background:linear-gradient(
    90deg,
    transparent 0%,
    rgba(255,255,255,0) 22%,
    rgba(255,255,255,.08) 38%,
    rgba(255,255,255,.58) 50%,
    rgba(255,255,255,.08) 62%,
    rgba(255,255,255,0) 78%,
    transparent 100%
  );
  mix-blend-mode:soft-light;
  filter:blur(.25px);
}
.card.is-morphing .shimmer{
  animation:shimmerSweep var(--shimmer) ease-in-out both;
}
@keyframes shimmerSweep{
  0%{opacity:0;transform:translateX(-120%) rotate(24deg)}
  12%{opacity:.15}
  24%{opacity:.82}
  76%{opacity:.82}
  88%{opacity:.15}
  100%{opacity:0;transform:translateX(430%) rotate(24deg)}
}
.card.is-morphing{transform:scale(.97) rotateX(4deg);box-shadow:0 24px 62px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.04)}
.panel{
  position:absolute;inset:0;padding:clamp(30px,7vw,44px);
  background:linear-gradient(145deg,rgba(255,255,255,.07),transparent 40%),var(--surface);
  clip-path:circle(150% at 50% 50%);
  transition:clip-path var(--morph) ease-in-out;
  overflow:hidden;
}
.panel-login{z-index:2;clip-path:circle(150% at 50% 50%);pointer-events:auto}
.panel-signup{z-index:1;clip-path:circle(0% at 50% 50%);pointer-events:none}
.card.is-signup .panel-login{clip-path:circle(0% at 50% 50%);pointer-events:none}
.card.is-signup .panel-signup{clip-path:circle(150% at 50% 50%);pointer-events:auto}
.content{position:relative;z-index:2}
.brand-mark{
  width:46px;height:46px;display:grid;place-items:center;margin-bottom:30px;
  border:1px solid var(--border);border-radius:14px;background:var(--raised);
  color:var(--text);font-size:.8rem;font-weight:800;letter-spacing:-.04em;
}
h1{margin:0 0 10px;font-size:clamp(2rem,7vw,2.55rem);line-height:1.05;letter-spacing:-.045em}
.subtitle{margin:0 0 30px;color:var(--muted);font-size:.95rem;line-height:1.6}
.form{display:grid;gap:16px}
.field{display:grid;gap:8px}
.field label{color:var(--text);font-size:.78rem;font-weight:650}
.input-wrap{position:relative}
.input-icon{position:absolute;top:50%;left:15px;width:18px;height:18px;display:grid;place-items:center;color:var(--muted);font-size:.88rem;pointer-events:none;transform:translateY(-50%)}
.field input{
  width:100%;height:50px;padding:0 15px 0 44px;border:1px solid var(--border);
  border-radius:14px;outline:none;background:rgba(255,255,255,.035);color:var(--text);
  transition:border-color 180ms ease,background 180ms ease,box-shadow 180ms ease;
}
.field input::placeholder{color:#6f7987}
.field input:focus{border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.055);box-shadow:0 0 0 4px rgba(255,255,255,.055)}
.form-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
.remember{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.78rem;cursor:pointer}
.remember input{width:15px;height:15px;accent-color:var(--accent)}
a{color:var(--text);font-size:.78rem;font-weight:650;text-decoration:none}
a:hover{text-decoration:underline}
.primary{
  width:100%;min-height:50px;margin-top:8px;border:0;border-radius:14px;
  background:var(--accent);color:var(--accent-contrast);cursor:pointer;font-weight:750;
  transition:transform 180ms ease,box-shadow 180ms ease;
}
.primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(0,0,0,.2)}
.primary:active{transform:translateY(0)}
.switch-copy{margin:42px 0 0;color:var(--muted);font-size:.82rem;line-height:1.5;text-align:center}
.switch{margin-left:4px;padding:0;border:0;background:none;color:var(--text);cursor:pointer;font:inherit;font-weight:750}
.switch:hover{text-decoration:underline}
.status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:560px){
  body{padding:20px 14px}
  .card{min-height:570px}
  .panel{padding:28px 22px}
}
@media(prefers-reduced-motion:reduce){
  .card,.panel,.field input,.primary{transition:none!important}
  .card.is-morphing{transform:none}
  .card.is-morphing .shimmer{animation:none!important;opacity:0!important}
}
</style>
</head>
<body>
<main class="page">
  <p class="lab-label">Animation Lab · Refraction Shimmer</p>
  <div class="scene">
    <section class="card" id="card" aria-live="polite">
      <div class="shimmer" aria-hidden="true"></div>
      <div class="panel panel-login" id="loginPanel">
        <div class="content">
          <div class="brand-mark" aria-hidden="true">VT</div>
          <h1>Login</h1>
          <p class="subtitle">Sign in to continue to your account.</p>
          <form class="form" id="loginForm">
            <div class="field">
              <label for="loginEmail">Email address</label>
              <div class="input-wrap"><span class="input-icon" aria-hidden="true">✉</span><input id="loginEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email"></div>
            </div>
            <div class="field">
              <label for="loginPassword">Password</label>
              <div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password"></div>
            </div>
            <div class="form-row">
              <label class="remember"><input id="rememberMe" type="checkbox">Remember me</label>
              <a href="#forgot-password">Forgot password?</a>
            </div>
            <button class="primary" type="submit">Sign In</button>
          </form>
          <p class="switch-copy">Don't have an account? <button class="switch" id="showSignup" type="button">Sign up</button></p>
        </div>
      </div>
      <div class="panel panel-signup" id="signupPanel">
        <div class="content">
          <div class="brand-mark" aria-hidden="true">VT</div>
          <h1>Sign up</h1>
          <p class="subtitle">Create an account to get started.</p>
          <form class="form" id="signupForm">
            <div class="field">
              <label for="signupName">Full name</label>
              <div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="signupName" name="name" type="text" placeholder="Your name" autocomplete="name"></div>
            </div>
            <div class="field">
              <label for="signupEmail">Email address</label>
              <div class="input-wrap"><span class="input-icon" aria-hidden="true">✉</span><input id="signupEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email"></div>
            </div>
            <div class="field">
              <label for="signupPassword">Password</label>
              <div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="signupPassword" name="password" type="password" placeholder="Create a password" autocomplete="new-password"></div>
            </div>
            <button class="primary" type="submit">Sign Up</button>
          </form>
          <p class="switch-copy">Already have an account? <button class="switch" id="showLogin" type="button">Log in</button></p>
        </div>
      </div>
    </section>
  </div>
  <p class="status" id="status" aria-live="polite">Login form is active.</p>
</main>
<script>
(()=>{
  const card=document.getElementById("card");
  const showSignup=document.getElementById("showSignup");
  const showLogin=document.getElementById("showLogin");
  const loginForm=document.getElementById("loginForm");
  const signupForm=document.getElementById("signupForm");
  const status=document.getElementById("status");
  const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)");
  const duration=720;
  let isSignup=false;
  let turning=false;

  function setPanelAccess(signup){
    document.getElementById("loginPanel").style.pointerEvents=signup?"none":"auto";
    document.getElementById("signupPanel").style.pointerEvents=signup?"auto":"none";
  }

  function morph(toSignup){
    if(turning || toSignup===isSignup)return;
    turning=true;
    card.classList.add("is-morphing");

    if(toSignup){
      card.classList.add("is-signup");
      status.textContent="Sign-up form is active.";
    }else{
      card.classList.remove("is-signup");
      status.textContent="Login form is active.";
    }

    if(reduceMotion.matches){
      isSignup=toSignup;
      setPanelAccess(toSignup);
      card.classList.remove("is-morphing");
      turning=false;
      return;
    }

    setTimeout(()=>{isSignup=toSignup;setPanelAccess(toSignup)},duration/2);
    setTimeout(()=>{card.classList.remove("is-morphing");turning=false},duration);
  }

  showSignup.addEventListener("click",()=>morph(true));
  showLogin.addEventListener("click",()=>morph(false));
  loginForm.addEventListener("submit",event=>event.preventDefault());
  signupForm.addEventListener("submit",event=>event.preventDefault());
  setPanelAccess(false);
})();
</script>
</body>
</html>
