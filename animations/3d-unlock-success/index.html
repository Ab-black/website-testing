<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Rounded column login and sign-up flip animation experiment.">
<title>Column Flip — Animation Lab</title>
<style>
:root{
  --bg:#0b0d10;--surface:#13171c;--raised:#1a1f26;--text:#f5f7fa;--muted:#9aa4b2;
  --border:rgba(255,255,255,.1);--accent:#fff;--accent-contrast:#0b0d10;
  --card:#f5f7fa;--card-soft:#eef1f4;--card-tint:#e9edf2;--card-text:#0b0d10;--card-muted:#66717f;
  --card-border:rgba(11,13,16,.1);
  --shadow:0 38px 96px rgba(0,0,0,.38),0 14px 34px rgba(0,0,0,.16);
  --radius:999px;--flip-duration:820ms;
}
*{box-sizing:border-box}
html{min-height:100%}
body{min-height:100vh;margin:0;display:grid;place-items:center;padding:32px 20px;background:radial-gradient(circle at 50% 48%,rgba(255,255,255,.045),transparent 42%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}.page{width:min(100%,460px)}
.lab-label{margin:0 0 18px;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-align:center;text-transform:uppercase}
.scene{width:100%;display:flex;justify-content:center;perspective:1500px;perspective-origin:50% 48%}
.card{position:relative;width:min(100%,350px);display:grid;grid-template-areas:"face";transform-style:preserve-3d;transform:rotateY(0deg);transition:transform var(--flip-duration) ease-in-out;will-change:transform;--card-rotation:0deg}
.card.is-signup{transform:rotateY(180deg);--card-rotation:180deg}
.card.is-login{transform:rotateY(0deg);--card-rotation:0deg}
.card.is-signup{transform:rotateY(180deg)}
.face{grid-area:face;position:relative;min-width:0;display:flex;flex-direction:column;padding:clamp(34px,8vw,40px) clamp(30px,8vw,38px);border:1px solid var(--card-border);border-radius:var(--radius);background:linear-gradient(145deg,var(--card),var(--card-soft) 55%,var(--card-tint));box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.82);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;isolation:isolate}
.front{transform:rotateY(0)}.back{transform:rotateY(180deg)}
.face::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:linear-gradient(90deg,transparent 8%,rgba(255,255,255,.12) 28%,rgba(255,255,255,.48) 50%,rgba(255,255,255,.12) 72%,transparent 92%);background-size:230% 100%;background-position:0% 50%;transition:background-position var(--flip-duration) ease-in-out;mix-blend-mode:soft-light}
.card.is-signup .face::before{background-position:100% 50%}
.content{position:relative;z-index:2;width:100%}
.brand-mark{width:46px;height:46px;display:grid;place-items:center;margin:0 auto 28px;border:1px solid var(--card-border);border-radius:14px;background:var(--card-tint);color:var(--card-text);font-size:.8rem;font-weight:800;letter-spacing:-.04em;box-shadow:0 10px 24px rgba(11,13,16,.08)}
h1{margin:0 0 10px;text-align:center;font-size:clamp(2rem,7vw,2.45rem);line-height:1.05;letter-spacing:-.045em}
.subtitle{margin:0 auto 28px;max-width:240px;color:var(--card-muted);font-size:.92rem;line-height:1.6;text-align:center}
.form{display:grid;gap:15px}.field{display:grid;gap:8px}.field label{color:var(--card-muted);font-size:.68rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase}.input-wrap{position:relative}.input-icon{display:none}.field input{width:100%;height:50px;padding:0 14px;border:1px solid var(--card-border);border-radius:14px;outline:none;background:linear-gradient(135deg,rgba(245,247,250,.98),rgba(233,237,242,.98));color:var(--card-text);box-shadow:inset 0 2px 8px rgba(11,13,16,.12),inset 0 1px 0 rgba(255,255,255,.82);transition:border-color 180ms ease,background 180ms ease,box-shadow 180ms ease}
.field input::placeholder{color:#7a8490}.field input:focus{border-color:rgba(11,13,16,.24);background:linear-gradient(135deg,#f8f9fa,#e9edf2);box-shadow:inset 0 2px 8px rgba(11,13,16,.1),0 0 0 4px rgba(11,13,16,.045)}
.form-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:1px}.remember{display:inline-flex;align-items:center;gap:7px;color:var(--card-muted);font-size:.76rem;cursor:pointer}.remember input{width:15px;height:15px;accent-color:var(--accent-contrast)}a{color:var(--card-text);font-size:.76rem;font-weight:650;text-decoration:none}a:hover{text-decoration:underline}
.primary{width:calc(50% - 5px);min-height:50px;margin-top:7px;border:1px solid var(--accent-contrast);border-radius:999px;background:var(--accent-contrast);color:var(--card);cursor:pointer;font-weight:750;transition:transform 180ms ease,box-shadow 180ms ease}.primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(11,13,16,.18)}.primary:active{transform:translateY(0)}
.switch-copy{margin:30px 0 0;color:var(--card-muted);font-size:.8rem;line-height:1.5;text-align:center}.switch{margin-left:4px;padding:0;border:1px solid rgba(11,13,16,.22);border-radius:999px;background:rgba(255,255,255,.52);color:var(--card-text);cursor:pointer;font:inherit;font-weight:750;position:relative;z-index:10;padding:7px 13px}.switch:hover{text-decoration:underline;background:rgba(255,255,255,.78)}
.front .switch,.front .form,.front a,.back .switch,.back .form,.back a{position:relative;z-index:5}
.front .switch,.front .form,.front a,.back .switch,.back .form,.back a{position:relative;z-index:5}
.back{pointer-events:none}.card.is-login .front{pointer-events:auto}.card.is-login .back{pointer-events:none}.card.is-signup .front{pointer-events:none}.card.is-signup .back{pointer-events:auto}

.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:7px}.action-row .primary{width:100%;margin-top:0}.action-row .secondary{width:100%;min-height:50px;border:1px solid rgba(11,13,16,.22);border-radius:999px;background:rgba(255,255,255,.52);color:var(--card-text);cursor:pointer;font-weight:750}.action-row .secondary:hover{background:rgba(255,255,255,.78);border-color:rgba(11,13,16,.34)}

.sr-status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Success confirmation layer */
.success-overlay{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:28px;border-radius:inherit;background:rgba(19,23,28,.97);opacity:0;visibility:hidden;pointer-events:none;transform:translateZ(40px)}
.card.is-success .success-overlay{opacity:1;visibility:visible;pointer-events:auto}
.success-content{display:grid;justify-items:center;gap:12px;text-align:center}
.success-title{margin:0;font-size:1.2rem}.success-copy{margin:0;color:var(--muted);font-size:.82rem}
.lock-stage{position:relative;width:110px;height:110px;display:grid;place-items:center;perspective:700px}
.progress-ring,.shield-ring{position:absolute;inset:0;width:110px;height:110px;transform:rotate(-90deg)}
.progress-ring circle,.shield-ring circle{fill:none;stroke:var(--accent);stroke-width:3}
.progress-ring .track{stroke:rgba(255,255,255,.1)}
.progress-ring .progress{stroke-dasharray:314.16;stroke-dashoffset:314.16}
.lock{position:relative;width:52px;height:44px;border:3px solid var(--accent);border-radius:10px;display:grid;place-items:center;background:var(--raised);box-shadow:0 14px 30px rgba(0,0,0,.22)}
.lock-body-key{width:6px;height:15px;border-radius:4px;background:var(--accent)}
.shackle{position:absolute;width:30px;height:30px;left:8px;top:-22px;border:3px solid var(--accent);border-bottom:0;border-radius:18px 18px 0 0;transform-origin:25px 24px;backface-visibility:hidden}
.shield-ring{opacity:0;transform:rotate(-90deg) scale(.75)}.shield-ring circle{stroke-dasharray:314.16;stroke-dashoffset:314.16}
.check{position:absolute;font-size:2.5rem;font-weight:900;line-height:1;color:var(--accent);opacity:0;transform:scale(.45)}
.card.success-login .progress-ring .progress{animation:fillRing 400ms ease-out forwards}.card.success-login .shackle{animation:unlockShackle 450ms ease-out 400ms forwards}.card.success-login .check{animation:checkIn 320ms ease-out 850ms forwards}
.card.success-created .shackle{transform:rotateX(0deg)}.card.success-created .shackle{animation:lockShackle 400ms ease-out forwards}.card.success-created .shield-ring{animation:shieldDraw 350ms ease-out 400ms forwards}.card.success-created .check{animation:checkIn 320ms ease-out 780ms forwards}
.card.success-login,.card.success-created{animation:cardPulse 560ms ease-in-out 400ms both}
.success-overlay[aria-hidden="true"]{visibility:hidden}
@keyframes fillRing{to{stroke-dashoffset:0}}@keyframes unlockShackle{to{transform:rotateY(50deg) translateX(5px)}}@keyframes lockShackle{to{transform:rotateX(-42deg)}}@keyframes shieldDraw{0%{opacity:1;transform:rotate(-90deg) scale(.75)}100%{opacity:1;transform:rotate(-90deg) scale(1);stroke-dashoffset:0}}@keyframes checkIn{to{opacity:1;transform:scale(1)}}@keyframes cardPulse{0%{transform:rotateY(var(--card-rotation,0)) scale(1)}35%{transform:rotateY(var(--card-rotation,0)) scale(1.025) rotateX(2.5deg)}100%{transform:rotateY(var(--card-rotation,0)) scale(1) rotateX(0)}}

.card.success-login.is-signup,.card.success-created.is-signup{--card-rotation:180deg}
.success-close{margin-top:8px;border:1px solid var(--border);border-radius:12px;padding:9px 14px;background:var(--raised);color:var(--text);cursor:pointer;font-size:.78rem}
.sr-status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:420px){body{padding:20px 14px}.card{width:min(100%,330px)}.face{padding:32px 28px}.form-row{align-items:flex-start}}
@media(max-width:350px){.card{width:100%}.face{padding-left:25px;padding-right:25px}.form-row{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.field input,.primary{transition:none}.card.success-login,.card.success-created{animation:none}.card.success-login .progress-ring .progress,.card.success-login .shackle,.card.success-login .check,.card.success-created .shackle,.card.success-created .shield-ring,.card.success-created .check{animation:none}.card.success-login .progress-ring .progress{stroke-dashoffset:0}.card.success-login .shackle{transform:rotateY(50deg) translateX(5px)}.card.success-created .shield-ring{opacity:1;transform:rotate(-90deg) scale(1)}.card.success-created .shield-ring circle{stroke-dashoffset:0}.card.success-login .check,.card.success-created .check{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<main class="page">
  <p class="lab-label">Animation Lab · Column Flip</p>

  <div class="scene">
    <section class="card is-login" id="authCard" aria-live="polite">
      <div class="face front">
        <div class="content">
          <div class="brand-mark" aria-hidden="true">VT</div>
          <h1>Login</h1>
          <p class="subtitle">Sign in to continue to your account.</p>

          <form class="form" id="loginForm">
            <div class="field">
              <label for="loginEmail">Email address</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">✉</span>
                <input id="loginEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email">
              </div>
            </div>

            <div class="field">
              <label for="loginPassword">Password</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">●</span>
                <input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password">
              </div>
            </div>

            <div class="form-row">
              <label class="remember"><input id="rememberMe" type="checkbox">Remember me</label>
              <a href="#forgot-password">Forgot password?</a>
            </div>

            <button class="primary" type="submit">Sign In</button>
          </form>

          <p class="switch-copy">Don't have an account?<button class="switch" id="showSignup" type="button">Sign up</button></p>
        </div>
      </div>

      <div class="face back">
        <div class="content">
          <div class="brand-mark" aria-hidden="true">VT</div>
          <h1>Sign up</h1>
          <p class="subtitle">Create an account and get started.</p>

          <form class="form" id="signupForm">
            <div class="field">
              <label for="signupName">Full name</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">◉</span>
                <input id="signupName" name="name" type="text" placeholder="Your full name" autocomplete="name">
              </div>
            </div>

            <div class="field">
              <label for="signupEmail">Email address</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">✉</span>
                <input id="signupEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email">
              </div>
            </div>

            <div class="field">
              <label for="signupPassword">Password</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">●</span>
                <input id="signupPassword" name="password" type="password" placeholder="Create a password" autocomplete="new-password">
              </div>
            </div>

            <button class="primary" type="submit">Create Account</button>
          </form>

          <p class="switch-copy">Already have an account?<button class="switch" id="showLogin" type="button">Log in</button></p>
        </div>
      </div>
    </section>
  </div>

  <div class="success-overlay" id="successOverlay" aria-hidden="true"><div class="success-content"><div class="lock-stage"><svg class="progress-ring" viewBox="0 0 110 110" aria-hidden="true"><circle class="track" cx="55" cy="55" r="50"></circle><circle class="progress" cx="55" cy="55" r="50"></circle></svg><svg class="shield-ring" viewBox="0 0 110 110" aria-hidden="true"><circle cx="55" cy="55" r="50"></circle></svg><div class="lock" aria-hidden="true"><span class="shackle"></span><span class="lock-body-key"></span><span class="check">✓</span></div></div><h2 class="success-title" id="successTitle">Success</h2><p class="success-copy" id="successCopy">Confirmation complete.</p><button class="success-close" id="successClose" type="button">Continue</button></div></div><p class="sr-status" id="status" aria-live="polite">Login form is active.</p>
</main>

<script>
(()=>{const card=document.getElementById("authCard"),showSignup=document.getElementById("showSignup"),showLogin=document.getElementById("showLogin"),status=document.getElementById("status"),overlay=document.getElementById("successOverlay"),title=document.getElementById("successTitle"),copy=document.getElementById("successCopy"),close=document.getElementById("successClose"),forms=document.querySelectorAll("form");let isSignUpVisible=false,isTurning=false,isSuccess=false;const reduce=window.matchMedia("(prefers-reduced-motion: reduce)");
function setAuthSide(next){
  isSignUpVisible=next;
  card.classList.toggle("is-signup",isSignUpVisible);
  card.classList.toggle("is-login",!isSignUpVisible);
  status.textContent=isSignUpVisible?"Sign-up form is active.":"Login form is active.";
}
showSignup.addEventListener("click",()=>setAuthSide(true));
showLogin.addEventListener("click",()=>setAuthSide(false));
function showSuccess(type){if(isSuccess)return;isSuccess=true;card.classList.remove("success-login","success-created","is-success");void card.offsetWidth;card.classList.add(type==="login"?"success-login":"success-created","is-success");overlay.setAttribute("aria-hidden","false");title.textContent=type==="login"?"Login successful":"Account created";copy.textContent=type==="login"?"Your account has been unlocked.":"Your new account is secured.";status.textContent=title.textContent+".";setTimeout(()=>{close.focus()},reduce.matches?0:1250)}
forms.forEach(form=>form.addEventListener("submit",e=>{e.preventDefault();showSuccess(form.id==="loginForm"?"login":"created")}));
close.addEventListener("click",()=>{card.classList.remove("success-login","success-created","is-success");overlay.setAttribute("aria-hidden","true");isSuccess=false;status.textContent=isSignUpVisible?"Sign-up form is active.":"Login form is active."});
})();
</script>
</body>
</html>
