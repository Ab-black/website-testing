<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Rounded column login and sign-up flip animation experiment.">
<title>Column Flip — Animation Lab</title>
<style>
:root{
  --bg:#0b0d10;
  --surface:#13171c;
  --raised:#1a1f26;
  --text:#f5f7fa;
  --muted:#9aa4b2;
  --border:rgba(255,255,255,.1);
  --accent:#fff;
  --accent-contrast:#0b0d10;
  --shadow:0 30px 80px rgba(0,0,0,.42);
  --radius:999px;
  --flip:820ms;
}
*{box-sizing:border-box}
html{min-height:100%}
body{
  min-height:100vh;margin:0;display:grid;place-items:center;padding:32px 20px;
  background:
    radial-gradient(circle at 50% 48%,rgba(255,255,255,.045),transparent 42%),
    var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input{font:inherit}
.page{width:min(100%,460px)}
.lab-label{
  margin:0 0 18px;color:var(--muted);font-size:.72rem;font-weight:700;
  letter-spacing:.14em;text-align:center;text-transform:uppercase;
}
.scene{
  width:100%;display:flex;justify-content:center;
  perspective:1500px;perspective-origin:50% 45%;
}
.card{
  position:relative;width:min(100%,350px);
  display:grid;grid-template-areas:"face";
  transform-style:preserve-3d;
  transform:rotateY(0deg);
  transition:transform var(--flip) ease-in-out;
  will-change:transform;
}
.card.is-signup{transform:rotateY(180deg)}
.face{
  grid-area:face;position:relative;min-width:0;
  display:flex;flex-direction:column;
  padding:clamp(34px,8vw,40px) clamp(30px,8vw,38px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:
    linear-gradient(145deg,rgba(255,255,255,.07),transparent 42%),
    var(--surface);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.045);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  overflow:hidden;
  isolation:isolate;
}
.front{transform:rotateY(0deg)}
.back{transform:rotateY(180deg)}
.face::before{
  content:"";
  position:absolute;inset:0;
  pointer-events:none;
  z-index:0;
  background:linear-gradient(
    90deg,
    transparent 0%,
    rgba(255,255,255,.015) 30%,
    rgba(255,255,255,.075) 48%,
    rgba(255,255,255,.025) 66%,
    transparent 100%
  );
  background-size:220% 100%;
  background-position:18% 50%;
}
.face::after{
  content:"";
  position:absolute;top:0;bottom:0;left:0;
  width:34%;
  pointer-events:none;
  z-index:1;
  background:linear-gradient(
    90deg,
    transparent 0%,
    rgba(255,255,255,.045) 35%,
    rgba(255,255,255,.095) 58%,
    transparent 100%
  );
  opacity:.9;
  transform:translateX(-18%);
}
.card.is-signup .face::before{
  animation:lightSweepForward var(--flip) ease-in-out both;
}
.card.is-login .face::before{
  animation:lightSweepReverse var(--flip) ease-in-out both;
}
.card.is-signup .face::after{
  animation:highlightForward var(--flip) ease-in-out both;
}
.card.is-login .face::after{
  animation:highlightReverse var(--flip) ease-in-out both;
}
.content{position:relative;z-index:2;width:100%}
.brand-mark{
  width:46px;height:46px;display:grid;place-items:center;margin:0 auto 28px;
  border:1px solid var(--border);border-radius:14px;background:var(--raised);
  color:var(--text);font-size:.8rem;font-weight:800;letter-spacing:-.04em;
}
h1{
  margin:0 0 10px;text-align:center;
  font-size:clamp(2rem,7vw,2.45rem);line-height:1.05;letter-spacing:-.045em;
}
.subtitle{
  margin:0 auto 28px;max-width:240px;
  color:var(--muted);font-size:.92rem;line-height:1.6;text-align:center;
}
.form{display:grid;gap:15px}
.field{display:grid;gap:8px}
.field label{color:var(--text);font-size:.77rem;font-weight:650}
.input-wrap{position:relative}
.input-icon{
  position:absolute;top:50%;left:14px;width:18px;height:18px;
  display:grid;place-items:center;color:var(--muted);font-size:.86rem;
  pointer-events:none;transform:translateY(-50%);
}
.field input{
  width:100%;height:50px;padding:0 13px 0 42px;
  border:1px solid var(--border);border-radius:14px;outline:none;
  background:rgba(255,255,255,.035);color:var(--text);
  transition:border-color 180ms ease,background 180ms ease,box-shadow 180ms ease;
}
.field input::placeholder{color:#6f7987}
.field input:focus{
  border-color:rgba(255,255,255,.32);
  background:rgba(255,255,255,.055);
  box-shadow:0 0 0 4px rgba(255,255,255,.055);
}
.form-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-top:1px;
}
.remember{
  display:inline-flex;align-items:center;gap:7px;
  color:var(--muted);font-size:.76rem;cursor:pointer;
}
.remember input{width:15px;height:15px;accent-color:var(--accent)}
a{color:var(--text);font-size:.76rem;font-weight:650;text-decoration:none}
a:hover{text-decoration:underline}
.primary{
  width:100%;min-height:50px;margin-top:7px;border:0;border-radius:14px;
  background:var(--accent);color:var(--accent-contrast);
  cursor:pointer;font-weight:750;
  transition:transform 180ms ease,box-shadow 180ms ease;
}
.primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(0,0,0,.2)}
.primary:active{transform:translateY(0)}
.switch-copy{
  margin:30px 0 0;color:var(--muted);font-size:.8rem;
  line-height:1.5;text-align:center;
}
.switch{
  margin-left:4px;padding:0;border:0;background:none;color:var(--text);
  cursor:pointer;font:inherit;font-weight:750;position:relative;z-index:5;
}
.switch:hover{text-decoration:underline}
.front .switch,.front .form,.front a{position:relative;z-index:5}
.back .switch,.back .form,.back a{position:relative;z-index:5}
.sr-status{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
.back{pointer-events:none}
.card.is-login .front{pointer-events:auto}
.card.is-login .back{pointer-events:none}
.card.is-signup .front{pointer-events:none}
.card.is-signup .back{pointer-events:auto}

@keyframes lightSweepForward{
  0%{background-position:18% 50%}
  50%{background-position:74% 50%}
  100%{background-position:98% 50%}
}
@keyframes lightSweepReverse{
  0%{background-position:98% 50%}
  50%{background-position:42% 50%}
  100%{background-position:18% 50%}
}
@keyframes highlightForward{
  0%{transform:translateX(-18%)}
  50%{transform:translateX(190%)}
  100%{transform:translateX(245%)}
}
@keyframes highlightReverse{
  0%{transform:translateX(245%)}
  50%{transform:translateX(70%)}
  100%{transform:translateX(-18%)}
}

@media(max-width:420px){
  body{padding:20px 14px}
  .card{width:min(100%,330px)}
  .face{padding:32px 28px}
  .form-row{align-items:flex-start}
}
@media(max-width:350px){
  .card{width:100%}
  .face{padding-left:25px;padding-right:25px}
  .form-row{flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){
  .card{transition:none}
  .card.is-signup{transform:rotateY(180deg)}
  .card.is-login{transform:rotateY(0deg)}
  .card.is-signup .face::before,
  .card.is-login .face::before,
  .card.is-signup .face::after,
  .card.is-login .face::after{animation:none}
  .field input,.primary{transition:none}
}
</style>
</head>
<body>
<main class="page">
  <p class="lab-label">Animation Lab · Column Flip</p>

  <div class="scene">
    <section class="card is-login" id="authCard" aria-live="polite">
      <div class="face front">
        <div class="content">
          <div class="brand-mark" aria-hidden="true">VT</div>
          <h1>Login</h1>
          <p class="subtitle">Sign in to continue to your account.</p>

          <form class="form" id="loginForm">
            <div class="field">
              <label for="loginEmail">Email address</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">✉</span>
                <input id="loginEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email">
              </div>
            </div>

            <div class="field">
              <label for="loginPassword">Password</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">●</span>
                <input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password">
              </div>
            </div>

            <div class="form-row">
              <label class="remember"><input id="rememberMe" type="checkbox">Remember me</label>
              <a href="#forgot-password">Forgot password?</a>
            </div>

            <button class="primary" type="submit">Sign In</button>
          </form>

          <p class="switch-copy">Don't have an account?<button class="switch" id="showSignup" type="button">Sign up</button></p>
        </div>
      </div>

      <div class="face back">
        <div class="content">
          <div class="brand-mark" aria-hidden="true">VT</div>
          <h1>Sign up</h1>
          <p class="subtitle">Create an account and get started.</p>

          <form class="form" id="signupForm">
            <div class="field">
              <label for="signupName">Full name</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">◉</span>
                <input id="signupName" name="name" type="text" placeholder="Your full name" autocomplete="name">
              </div>
            </div>

            <div class="field">
              <label for="signupEmail">Email address</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">✉</span>
                <input id="signupEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email">
              </div>
            </div>

            <div class="field">
              <label for="signupPassword">Password</label>
              <div class="input-wrap">
                <span class="input-icon" aria-hidden="true">●</span>
                <input id="signupPassword" name="password" type="password" placeholder="Create a password" autocomplete="new-password">
              </div>
            </div>

            <button class="primary" type="submit">Create Account</button>
          </form>

          <p class="switch-copy">Already have an account?<button class="switch" id="showLogin" type="button">Log in</button></p>
        </div>
      </div>
    </section>
  </div>

  <p class="sr-status" id="status" aria-live="polite">Login form is active.</p>
</main>

<script>
(()=>{
  const card=document.getElementById("authCard");
  const showSignup=document.getElementById("showSignup");
  const showLogin=document.getElementById("showLogin");
  const status=document.getElementById("status");
  const forms=document.querySelectorAll("form");

  let isSignUpVisible=false;
  let isTurning=false;

  function toggleAuth(){
    if(isTurning)return;

    isTurning=true;
    isSignUpVisible=!isSignUpVisible;

    card.classList.remove("is-login","is-signup");
    void card.offsetWidth;
    card.classList.add(isSignUpVisible ? "is-signup" : "is-login");

    status.textContent=isSignUpVisible ? "Sign-up form is active." : "Login form is active.";
  }

  card.addEventListener("transitionend",(event)=>{
    if(event.propertyName!=="transform")return;

    card.style.transform=isSignUpVisible ? "rotateY(180deg)" : "rotateY(0deg)";
    isTurning=false;
  });

  showSignup.addEventListener("click",toggleAuth);
  showLogin.addEventListener("click",toggleAuth);

  forms.forEach(form=>form.addEventListener("submit",event=>event.preventDefault()));
})();
</script>
</body>
</html>
