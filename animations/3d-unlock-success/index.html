<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="3D unlock success confirmation login animation experiment.">
<title>3D Unlock Success — Animation Lab</title>
<style>
:root{
  --bg:#0b0d10;
  --surface:#13171c;
  --raised:#1a1f26;
  --text:#f5f7fa;
  --muted:#9aa4b2;
  --border:rgba(255,255,255,.1);
  --accent:#fff;
  --accent-contrast:#0b0d10;
  --shadow:0 30px 80px rgba(0,0,0,.42);
  --radius:24px;
}
*{box-sizing:border-box}
html{min-height:100%}
body{
  min-height:100vh;margin:0;display:grid;place-items:center;padding:32px 20px;
  background:radial-gradient(circle at 50% 48%,rgba(255,255,255,.045),transparent 42%),var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
}
button,input{font:inherit}
.page{width:min(100%,460px)}
.lab-label{margin:0 0 14px;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-align:center;text-transform:uppercase}
.scene{width:100%;perspective:1200px}
.card{
  position:relative;width:100%;min-height:610px;padding:clamp(30px,7vw,44px);
  border:1px solid var(--border);border-radius:var(--radius);
  background:linear-gradient(145deg,rgba(255,255,255,.07),transparent 40%),var(--surface);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.045);
  transform-style:preserve-3d;overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.055),transparent 32%,transparent 70%,rgba(255,255,255,.018));
}
.content{position:relative;z-index:2}
.brand-mark{
  width:46px;height:46px;display:grid;place-items:center;margin-bottom:30px;
  border:1px solid var(--border);border-radius:14px;background:var(--raised);
  color:var(--text);font-size:.8rem;font-weight:800;letter-spacing:-.04em;
}
h1{margin:0 0 10px;font-size:clamp(2rem,7vw,2.55rem);line-height:1.05;letter-spacing:-.045em}
.subtitle{margin:0 0 30px;color:var(--muted);font-size:.95rem;line-height:1.6}
.form{display:grid;gap:16px}
.field{display:grid;gap:8px}
.field label{color:var(--text);font-size:.78rem;font-weight:650}
.input-wrap{position:relative}
.input-icon{
  position:absolute;top:50%;left:15px;width:18px;height:18px;display:grid;place-items:center;
  color:var(--muted);font-size:.88rem;pointer-events:none;transform:translateY(-50%);
}
.field input{
  width:100%;height:50px;padding:0 15px 0 44px;border:1px solid var(--border);
  border-radius:14px;outline:none;background:rgba(255,255,255,.035);color:var(--text);
  transition:border-color 180ms ease,background 180ms ease,box-shadow 180ms ease;
}
.field input::placeholder{color:#6f7987}
.field input:focus{border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.055);box-shadow:0 0 0 4px rgba(255,255,255,.055)}
.form-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
.remember{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.78rem;cursor:pointer}
.remember input{width:15px;height:15px;accent-color:var(--accent)}
a{color:var(--text);font-size:.78rem;font-weight:650;text-decoration:none}
a:hover{text-decoration:underline}
.primary{
  width:100%;min-height:50px;margin-top:8px;border:0;border-radius:14px;
  background:var(--accent);color:var(--accent-contrast);cursor:pointer;font-weight:750;
  transition:transform 180ms ease,box-shadow 180ms ease;
}
.primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(0,0,0,.2)}
.primary:active{transform:translateY(0)}
.confirmation{
  position:absolute;inset:0;z-index:8;display:grid;place-items:center;
  pointer-events:none;opacity:0;visibility:hidden;
  background:rgba(11,13,16,.08);
}
.confirmation.is-visible{opacity:1;visibility:visible}
.confirmation-inner{display:grid;place-items:center;gap:16px}
.lock-stage{width:88px;height:88px;perspective:700px;display:grid;place-items:center}
.lock{
  position:relative;width:58px;height:48px;border:2px solid var(--accent);
  border-radius:10px;background:var(--raised);
  box-shadow:0 18px 36px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);
}
.shackle{
  position:absolute;left:50%;top:-34px;width:36px;height:40px;
  border:5px solid var(--accent);border-bottom:0;border-radius:20px 20px 0 0;
  transform:translateX(-50%);transform-origin:78% 88%;backface-visibility:hidden;
}
.keyhole{
  position:absolute;left:50%;top:50%;width:8px;height:12px;border-radius:5px;
  background:var(--accent);transform:translate(-50%,-35%);
}
.check{
  position:absolute;left:50%;top:50%;width:56px;height:56px;
  display:grid;place-items:center;border:1px solid var(--border);border-radius:50%;
  background:var(--raised);color:var(--accent);font-size:2rem;font-weight:800;
  opacity:0;transform:translate(-50%,-50%) scale(.55);
}
.confirmation.is-animating .shackle{animation:unlock 460ms ease-out forwards}
.confirmation.is-animating .check{animation:checkIn 440ms 300ms ease-out forwards}
@keyframes unlock{
  0%{transform:translateX(-50%) rotateY(0deg)}
  100%{transform:translateX(-50%) rotateY(50deg)}
}
@keyframes checkIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
.card.is-success{animation:cardSuccess 560ms ease-out both}
@keyframes cardSuccess{
  0%{transform:scale(1) rotateX(0)}
  38%{transform:scale(1.025) rotateX(-2.5deg)}
  100%{transform:scale(1) rotateX(0)}
}
.success-text{margin:0;color:var(--text);font-size:.84rem;font-weight:700;letter-spacing:.02em}
.status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:560px){
  body{padding:20px 14px}
  .card{min-height:570px;padding:28px 22px}
}
@media(prefers-reduced-motion:reduce){
  .card,.field input,.primary{animation:none!important;transition:none!important}
  .confirmation.is-animating .shackle{animation:none}
  .confirmation.is-animating .check{animation:none;opacity:1;transform:translate(-50%,-50%) scale(1)}
  .card.is-success{transform:none}
}
</style>
</head>
<body>
<main class="page">
  <p class="lab-label">Animation Lab · 3D Unlock Success</p>
  <div class="scene">
    <section class="card" id="card" aria-live="polite">
      <div class="content">
        <div class="brand-mark" aria-hidden="true">VT</div>
        <h1>Login</h1>
        <p class="subtitle">Sign in to continue to your account.</p>
        <form class="form" id="loginForm">
          <div class="field">
            <label for="loginEmail">Email address</label>
            <div class="input-wrap"><span class="input-icon" aria-hidden="true">✉</span><input id="loginEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email"></div>
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password"></div>
          </div>
          <div class="form-row">
            <label class="remember"><input id="rememberMe" type="checkbox">Remember me</label>
            <a href="#forgot-password">Forgot password?</a>
          </div>
          <button class="primary" type="submit">Sign In</button>
        </form>
      </div>

      <div class="confirmation" id="confirmation" aria-hidden="true">
        <div class="confirmation-inner">
          <div class="lock-stage" aria-hidden="true">
            <div class="lock">
              <span class="shackle"></span>
              <span class="keyhole"></span>
              <span class="check">✓</span>
            </div>
          </div>
          <p class="success-text">Login successful</p>
        </div>
      </div>
    </section>
  </div>
  <p class="status" id="status" aria-live="polite">Login form is active.</p>
</main>
<script>
(()=>{
  const card=document.getElementById("card");
  const form=document.getElementById("loginForm");
  const confirmation=document.getElementById("confirmation");
  const status=document.getElementById("status");
  const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)");
  let busy=false;

  function resetConfirmation(){
    confirmation.classList.remove("is-visible","is-animating");
    confirmation.setAttribute("aria-hidden","true");
    card.classList.remove("is-success");
  }

  function playSuccess(){
    if(busy)return;
    busy=true;
    confirmation.classList.remove("is-animating");
    void confirmation.offsetWidth;
    confirmation.classList.add("is-visible","is-animating");
    confirmation.setAttribute("aria-hidden","false");
    card.classList.add("is-success");
    status.textContent="Login successful.";

    if(reduceMotion.matches){
      setTimeout(resetConfirmation,900);
      busy=false;
      return;
    }

    setTimeout(resetConfirmation,1100);
    setTimeout(()=>{busy=false},1100);
  }

  form.addEventListener("submit",event=>{
    event.preventDefault();
    // This repo has no authentication backend. The submit is used only
    // as a visual success trigger for the animation experiment.
    playSuccess();
  });
})();
</script>
</body>
</html>
