<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Premium X-axis login and sign-up page flip animation experiment.">
  <title>Login Flip X — Animation Lab</title>
  <style>
    :root {
      /* Existing website-testing palette */
      --bg: #0b0d10;
      --surface: #13171c;
      --surface-raised: #1a1f26;
      --text: #f5f7fa;
      --muted: #9aa4b2;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #ffffff;
      --accent-contrast: #0b0d10;

      /* Premium card tones derived only from the existing palette */
      --card: #f5f7fa;
      --card-soft: #eef1f4;
      --card-tint: #e9edf2;
      --card-text: #0b0d10;
      --card-muted: #66717f;
      --card-border: rgba(11, 13, 16, 0.1);
      --card-shadow:
        0 34px 90px rgba(0, 0, 0, 0.38),
        0 12px 30px rgba(0, 0, 0, 0.16);
      --field-shadow:
        inset 0 2px 5px rgba(11, 13, 16, 0.08),
        inset 0 -1px 0 rgba(255, 255, 255, 0.78);
      --radius: 28px;
      --duration: 720ms;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.07), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    .page {
      width: min(100%, 470px);
    }

    .lab-label {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-align: center;
      text-transform: uppercase;
    }

    .flip-container {
      width: 100%;
      perspective: 1300px;
    }

    /*
      Both faces occupy the same grid cell. The card therefore grows from
      its content instead of relying on a restrictive fixed height.
    */
    .flip-card {
      position: relative;
      display: grid;
      width: 100%;
      transform: rotateX(0deg);
      transform-style: preserve-3d;
      transition: transform var(--duration) ease-in-out;
      will-change: transform;
    }

    .flip-face {
      grid-area: 1 / 1;
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: clamp(30px, 7vw, 40px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, var(--card), var(--card-soft) 56%, var(--card-tint));
      box-shadow: var(--card-shadow);
      color: var(--card-text);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .flip-face.back {
      transform: rotateX(180deg);
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      margin-bottom: 26px;
      border: 1px solid rgba(11, 13, 16, 0.09);
      border-radius: 14px;
      background: linear-gradient(145deg, #ffffff, var(--card-soft));
      box-shadow:
        0 5px 12px rgba(11, 13, 16, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      color: var(--card-text);
      font-size: 0.78rem;
      font-weight: 850;
      letter-spacing: -0.04em;
    }

    h1 {
      position: relative;
      margin: 0 0 8px;
      color: var(--card-text);
      font-size: clamp(1.9rem, 7vw, 2.45rem);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    .subtitle {
      position: relative;
      margin: 0 0 28px;
      color: var(--card-muted);
      font-size: 0.94rem;
      line-height: 1.55;
    }

    .form {
      position: relative;
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      color: var(--card-muted);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border: 1px solid rgba(11, 13, 16, 0.08);
      border-radius: 14px;
      outline: none;
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.92), rgba(233, 237, 242, 0.94));
      box-shadow: var(--field-shadow);
      color: var(--card-text);
      transition:
        border-color 180ms ease,
        box-shadow 180ms ease,
        background 180ms ease;
    }

    .field input::placeholder {
      color: #89929e;
    }

    .field input:focus {
      border-color: rgba(11, 13, 16, 0.22);
      background:
        linear-gradient(160deg, #ffffff, rgba(233, 237, 242, 0.98));
      box-shadow:
        inset 0 2px 5px rgba(11, 13, 16, 0.06),
        0 0 0 4px rgba(11, 13, 16, 0.055);
    }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 1px;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--card-muted);
      font-size: 0.76rem;
      cursor: pointer;
    }

    .remember input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--card-text);
    }

    .forgot {
      color: var(--card-text);
      font-size: 0.76rem;
      font-weight: 750;
      text-decoration: none;
    }

    .forgot:hover { text-decoration: underline; }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .action {
      min-width: 0;
      min-height: 50px;
      padding: 0 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 800;
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        background 180ms ease;
    }

    .action:hover { transform: translateY(-1px); }
    .action:active { transform: translateY(0); }

    .action.primary {
      border: 1px solid var(--card-text);
      background: var(--card-text);
      color: var(--accent);
      box-shadow: 0 7px 16px rgba(11, 13, 16, 0.16);
    }

    .action.secondary {
      border: 1px solid rgba(11, 13, 16, 0.17);
      background: rgba(255, 255, 255, 0.34);
      color: var(--card-text);
    }

    .action.secondary:hover {
      background: rgba(255, 255, 255, 0.58);
    }

    .switch-copy {
      margin: 24px 0 0;
      padding-top: 18px;
      border-top: 1px solid rgba(11, 13, 16, 0.08);
      color: var(--card-muted);
      font-size: 0.79rem;
      line-height: 1.5;
      text-align: center;
    }

    .switch {
      margin-left: 4px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--card-text);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }

    .switch:hover { text-decoration: underline; }

    .sr-status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    :focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.55);
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      body { padding: 20px 14px; }

      .flip-face {
        padding: 28px 22px;
      }

      .brand-mark {
        margin-bottom: 22px;
      }

      .form-row {
        align-items: flex-start;
      }
    }

    @media (max-width: 350px) {
      .flip-face {
        padding: 26px 18px;
      }

      .actions {
        gap: 8px;
      }

      .action {
        padding-inline: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .flip-card {
        transition-duration: 1ms;
      }

      .field input,
      .action {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="lab-label">Animation Lab · X-Axis Flip</p>

    <div class="flip-container">
      <section class="flip-card" id="authCard" aria-live="polite">
        <div class="flip-face front">
          <div class="brand-mark" aria-hidden="true">VT</div>
          <h1>Login</h1>
          <p class="subtitle">Sign in to continue to your account.</p>

          <form class="form" id="loginForm">
            <div class="field">
              <label for="loginEmail">Email address</label>
              <input id="loginEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email">
            </div>

            <div class="field">
              <label for="loginPassword">Password</label>
              <input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password">
            </div>

            <div class="form-row">
              <label class="remember">
                <input id="rememberMe" type="checkbox">
                Remember me
              </label>
              <a class="forgot" href="#forgot-password">Forgot password?</a>
            </div>

            <div class="actions">
              <button class="action primary" type="submit">Sign In</button>
              <button class="action secondary" id="showSignup" type="button">Create Account</button>
            </div>
          </form>

          <p class="switch-copy">
            New here?
            <button class="switch" type="button" data-show-signup>Sign up</button>
          </p>
        </div>

        <div class="flip-face back">
          <div class="brand-mark" aria-hidden="true">VT</div>
          <h1>Sign up</h1>
          <p class="subtitle">Create your account and get started.</p>

          <form class="form" id="signupForm">
            <div class="field">
              <label for="signupName">Full name</label>
              <input id="signupName" name="name" type="text" placeholder="Your full name" autocomplete="name">
            </div>

            <div class="field">
              <label for="signupEmail">Email address</label>
              <input id="signupEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email">
            </div>

            <div class="field">
              <label for="signupPassword">Password</label>
              <input id="signupPassword" name="password" type="password" placeholder="Create a password" autocomplete="new-password">
            </div>

            <div class="actions">
              <button class="action primary" type="submit">Sign Up</button>
              <button class="action secondary" id="showLogin" type="button">Log In</button>
            </div>
          </form>

          <p class="switch-copy">
            Already have an account?
            <button class="switch" type="button" data-show-login>Log in</button>
          </p>
        </div>
      </section>
    </div>

    <p class="sr-status" id="flipStatus" aria-live="polite">Login form is active.</p>
  </main>

  <script>
    (() => {
      const card = document.getElementById("authCard");
      const status = document.getElementById("flipStatus");
      const loginForm = document.getElementById("loginForm");
      const signupForm = document.getElementById("signupForm");

      // One explicit state directly controls the only two resting positions.
      let isSignUpVisible = false;

      function renderFace() {
        card.style.transform = isSignUpVisible
          ? "rotateX(180deg)"
          : "rotateX(0deg)";

        status.textContent = isSignUpVisible
          ? "Sign-up form is active."
          : "Login form is active.";
      }

      function showSignUp() {
        isSignUpVisible = true;
        renderFace();
      }

      function showLogin() {
        isSignUpVisible = false;
        renderFace();
      }

      document.querySelectorAll("#showSignup, [data-show-signup]").forEach((trigger) => {
        trigger.addEventListener("click", showSignUp);
      });

      document.querySelectorAll("#showLogin, [data-show-login]").forEach((trigger) => {
        trigger.addEventListener("click", showLogin);
      });

      // Visual-only demo: no backend is connected.
      loginForm.addEventListener("submit", (event) => event.preventDefault());
      signupForm.addEventListener("submit", (event) => event.preventDefault());

      renderFace();
    })();
  </script>
</body>
</html>
