<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Orbital halo ring login animation experiment.">
<title>Orbital Halo — Animation Lab</title>
<style>
:root{
  --bg:#0b0d10;
  --surface:#13171c;
  --raised:#1a1f26;
  --text:#f5f7fa;
  --muted:#9aa4b2;
  --border:rgba(255,255,255,.1);
  --accent:#fff;
  --accent-contrast:#0b0d10;
  --shadow:0 30px 80px rgba(0,0,0,.42);
  --radius:24px;
  --parallax-x:0px;
  --parallax-y:0px;
}
*{box-sizing:border-box}
html{min-height:100%}
body{
  min-height:100vh;margin:0;display:grid;place-items:center;padding:32px 20px;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.035),transparent 45%),
    var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
}
button,input{font:inherit}
.page{width:min(100%,460px)}
.lab-label{
  margin:0 0 14px;color:var(--muted);font-size:.72rem;font-weight:700;
  letter-spacing:.14em;text-align:center;text-transform:uppercase;
}
.scene{
  position:relative;width:100%;perspective:1200px;perspective-origin:50% 50%;
}
.halos{
  position:absolute;inset:-180px;pointer-events:none;overflow:visible;
  transform-style:preserve-3d;
}
.ring{
  position:absolute;left:50%;top:50%;border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:radial-gradient(circle,transparent 61%,rgba(255,255,255,.025) 68%,transparent 76%);
  box-shadow:0 0 28px rgba(255,255,255,.035),inset 0 0 24px rgba(255,255,255,.025);
  will-change:transform;
}
.ring:after{
  content:"";position:absolute;inset:-1px;border-radius:inherit;
  border:1px solid rgba(255,255,255,.055);filter:blur(4px);
}
.ring-outer{
  width:680px;height:680px;margin:-340px;
  animation:orbitOuter 30s linear infinite;
}
.ring-middle{
  width:500px;height:500px;margin:-250px;
  animation:orbitMiddle 45s linear infinite reverse;
}
.ring-inner{
  width:350px;height:350px;margin:-175px;
  animation:orbitInner 55s linear infinite;
}
.card{
  position:relative;width:100%;min-height:610px;padding:clamp(30px,7vw,44px);
  border:1px solid var(--border);border-radius:var(--radius);
  background:
    linear-gradient(145deg,rgba(255,255,255,.07),transparent 40%),
    var(--surface);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.045);
  z-index:2;
  overflow:hidden;
}
.card:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.055),transparent 32%,transparent 70%,rgba(255,255,255,.018));
}
.content{position:relative;z-index:2}
.brand-mark{
  width:46px;height:46px;display:grid;place-items:center;margin-bottom:30px;
  border:1px solid var(--border);border-radius:14px;background:var(--raised);
  color:var(--text);font-size:.8rem;font-weight:800;letter-spacing:-.04em;
}
h1{
  margin:0 0 10px;font-size:clamp(2rem,7vw,2.55rem);line-height:1.05;letter-spacing:-.045em;
}
.subtitle{margin:0 0 30px;color:var(--muted);font-size:.95rem;line-height:1.6}
.form{display:grid;gap:16px}
.field{display:grid;gap:8px}
.field label{color:var(--text);font-size:.78rem;font-weight:650}
.input-wrap{position:relative}
.input-icon{
  position:absolute;top:50%;left:15px;width:18px;height:18px;display:grid;place-items:center;
  color:var(--muted);font-size:.88rem;pointer-events:none;transform:translateY(-50%);
}
.field input{
  width:100%;height:50px;padding:0 15px 0 44px;border:1px solid var(--border);
  border-radius:14px;outline:none;background:rgba(255,255,255,.035);color:var(--text);
  transition:border-color 180ms ease,background 180ms ease,box-shadow 180ms ease;
}
.field input::placeholder{color:#6f7987}
.field input:focus{
  border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.055);
  box-shadow:0 0 0 4px rgba(255,255,255,.055);
}
.form-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
.remember{
  display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.78rem;cursor:pointer;
}
.remember input{width:15px;height:15px;accent-color:var(--accent)}
a{color:var(--text);font-size:.78rem;font-weight:650;text-decoration:none}
a:hover{text-decoration:underline}
.primary{
  width:100%;min-height:50px;margin-top:8px;border:0;border-radius:14px;
  background:var(--accent);color:var(--accent-contrast);cursor:pointer;font-weight:750;
  transition:transform 180ms ease,box-shadow 180ms ease;
}
.primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(0,0,0,.2)}
.primary:active{transform:translateY(0)}
.switch-copy{margin:42px 0 0;color:var(--muted);font-size:.82rem;line-height:1.5;text-align:center}
.switch{
  margin-left:4px;padding:0;border:0;background:none;color:var(--text);
  cursor:pointer;font:inherit;font-weight:750;
}
.switch:hover{text-decoration:underline}
.sr-status{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
@keyframes orbitOuter{to{transform:translate(var(--parallax-x),var(--parallax-y)) rotate(360deg)}}
@keyframes orbitMiddle{to{transform:translate(var(--parallax-x),var(--parallax-y)) rotate(-360deg)}}
@keyframes orbitInner{to{transform:translate(var(--parallax-x),var(--parallax-y)) rotate(360deg)}}
@media(max-width:560px){
  body{padding:20px 14px}
  .halos{inset:-130px}
  .ring-outer{width:520px;height:520px;margin:-260px}
  .ring-middle{width:390px;height:390px;margin:-195px}
  .ring-inner{width:275px;height:275px;margin:-137.5px}
  .card{min-height:570px;padding:28px 22px}
}
@media(prefers-reduced-motion:reduce){
  .ring{animation:none!important;transform:none!important}
  .field input,.primary{transition:none}
}
</style>
</head>
<body>
<main class="page">
  <p class="lab-label">Animation Lab · Orbital Halo</p>
  <div class="scene" id="scene">
    <div class="halos" aria-hidden="true">
      <div class="ring ring-outer"></div>
      <div class="ring ring-middle"></div>
      <div class="ring ring-inner"></div>
    </div>
    <section class="card" aria-live="polite">
      <div class="content">
        <div class="brand-mark" aria-hidden="true">VT</div>
        <h1>Login</h1>
        <p class="subtitle">Sign in to continue to your account.</p>
        <form class="form" id="loginForm">
          <div class="field">
            <label for="loginEmail">Email address</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">✉</span>
              <input id="loginEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email">
            </div>
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">●</span>
              <input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password">
            </div>
          </div>
          <div class="form-row">
            <label class="remember"><input id="rememberMe" type="checkbox">Remember me</label>
            <a href="#forgot-password">Forgot password?</a>
          </div>
          <button class="primary" type="submit">Sign In</button>
        </form>
        <p class="switch-copy">Don't have an account?<button class="switch" id="showSignup" type="button">Sign up</button></p>
      </div>
    </section>
  </div>
  <p class="sr-status" id="status" aria-live="polite">Login form is active.</p>
</main>
<script>
(()=>{
  const form=document.getElementById("loginForm");
  const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)");
  const rings=[...document.querySelectorAll(".ring")];
  let frame=null;
  function updateParallax(event){
    if(reduceMotion.matches)return;
    const x=(event.clientX/window.innerWidth-.5);
    const y=(event.clientY/window.innerHeight-.5);
    const baseX=x*12;
    const baseY=y*12;
    rings.forEach((ring,index)=>{
      const sensitivity=[1,.72,.48][index];
      ring.style.setProperty("--parallax-x",(-baseX*sensitivity)+"px");
      ring.style.setProperty("--parallax-y",(-baseY*sensitivity)+"px");
    });
  }
  window.addEventListener("mousemove",event=>{
    if(frame)return;
    frame=requestAnimationFrame(()=>{
      updateParallax(event);
      frame=null;
    });
  },{passive:true});
  window.addEventListener("mouseleave",()=>{
    rings.forEach(ring=>{
      ring.style.setProperty("--parallax-x","0px");
      ring.style.setProperty("--parallax-y","0px");
    });
  });
  form.addEventListener("submit",event=>event.preventDefault());
})();
</script>
</body>
</html>
