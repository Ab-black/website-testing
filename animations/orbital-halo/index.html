<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Orbital halo login animation experiment.">
<title>Orbital Halo — Animation Lab</title>
<style>
:root{
  --bg:#0b0d10;
  --surface:#13171c;
  --raised:#1a1f26;
  --text:#f5f7fa;
  --muted:#9aa4b2;
  --border:rgba(255,255,255,.1);
  --accent:#fff;
  --accent-contrast:#0b0d10;
  --shadow:0 30px 80px rgba(0,0,0,.42);
  --radius:24px;
}
*{box-sizing:border-box}
html{min-height:100%}
body{
  min-height:100vh;margin:0;display:grid;place-items:center;padding:32px 20px;
  background:
    radial-gradient(circle at 50% 48%,rgba(255,255,255,.045),transparent 42%),
    var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
}
button,input{font:inherit}
.page{width:min(100%,460px)}
.lab-label{
  margin:0 0 14px;color:var(--muted);font-size:.72rem;font-weight:700;
  letter-spacing:.14em;text-align:center;text-transform:uppercase;
}
.scene{
  position:relative;width:100%;perspective:1200px;perspective-origin:50% 50%;
}
.halos{
  position:absolute;inset:-190px;pointer-events:none;overflow:visible;
  transform-style:preserve-3d;
}
.ring{
  position:absolute;left:50%;top:50%;border-radius:50%;
  will-change:transform;
  transform-style:preserve-3d;
}
.ring::before,
.ring::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
}
.ring::before{
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 0 22px rgba(255,255,255,.035),inset 0 0 22px rgba(255,255,255,.018);
}
.ring::after{
  inset:5px;
  border:1px solid rgba(255,255,255,.045);
  filter:blur(3px);
}
.ring-outer{
  width:700px;height:700px;margin:-350px;
  animation:orbitOuter 30s linear infinite;
  background:conic-gradient(from 25deg,transparent 0 32%,rgba(255,255,255,.09) 36%,transparent 42% 72%,rgba(255,255,255,.055) 76%,transparent 82%);
  -webkit-mask:radial-gradient(circle,transparent 69.5%,#000 70%,#000 70.6%,transparent 71.2%);
  mask:radial-gradient(circle,transparent 69.5%,#000 70%,#000 70.6%,transparent 71.2%);
}
.ring-middle{
  width:510px;height:510px;margin:-255px;
  animation:orbitMiddle 48s linear infinite;
  background:conic-gradient(from 190deg,transparent 0 22%,rgba(255,255,255,.07) 27%,transparent 34% 66%,rgba(255,255,255,.055) 71%,transparent 78%);
  -webkit-mask:radial-gradient(circle,transparent 69.2%,#000 69.8%,#000 70.5%,transparent 71.1%);
  mask:radial-gradient(circle,transparent 69.2%,#000 69.8%,#000 70.5%,transparent 71.1%);
}
.ring-inner{
  width:350px;height:350px;margin:-175px;
  animation:orbitInner 58s linear infinite reverse;
  background:conic-gradient(from 80deg,transparent 0 28%,rgba(255,255,255,.085) 34%,transparent 41% 70%,rgba(255,255,255,.05) 76%,transparent 83%);
  -webkit-mask:radial-gradient(circle,transparent 68.8%,#000 69.5%,#000 70.5%,transparent 71.2%);
  mask:radial-gradient(circle,transparent 68.8%,#000 69.5%,#000 70.5%,transparent 71.2%);
}
.card{
  position:relative;width:100%;min-height:610px;padding:clamp(30px,7vw,44px);
  border:1px solid var(--border);border-radius:var(--radius);
  background:
    linear-gradient(145deg,rgba(255,255,255,.07),transparent 40%),
    var(--surface);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.045);
  z-index:2;overflow:hidden;
}
.card:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.055),transparent 32%,transparent 70%,rgba(255,255,255,.018));
}
.content{position:relative;z-index:2}
.brand-mark{
  width:46px;height:46px;display:grid;place-items:center;margin-bottom:30px;
  border:1px solid var(--border);border-radius:14px;background:var(--raised);
  color:var(--text);font-size:.8rem;font-weight:800;letter-spacing:-.04em;
}
h1{margin:0 0 10px;font-size:clamp(2rem,7vw,2.55rem);line-height:1.05;letter-spacing:-.045em}
.subtitle{margin:0 0 30px;color:var(--muted);font-size:.95rem;line-height:1.6}
.form{display:grid;gap:16px}
.field{display:grid;gap:8px}
.field label{color:var(--text);font-size:.78rem;font-weight:650}
.input-wrap{position:relative}
.input-icon{
  position:absolute;top:50%;left:15px;width:18px;height:18px;display:grid;place-items:center;
  color:var(--muted);font-size:.88rem;pointer-events:none;transform:translateY(-50%);
}
.field input{
  width:100%;height:50px;padding:0 15px 0 44px;border:1px solid var(--border);
  border-radius:14px;outline:none;background:rgba(255,255,255,.035);color:var(--text);
  transition:border-color 180ms ease,background 180ms ease,box-shadow 180ms ease;
}
.field input::placeholder{color:#6f7987}
.field input:focus{
  border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.055);
  box-shadow:0 0 0 4px rgba(255,255,255,.055);
}
.form-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
.remember{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.78rem;cursor:pointer}
.remember input{width:15px;height:15px;accent-color:var(--accent)}
a{color:var(--text);font-size:.78rem;font-weight:650;text-decoration:none}
a:hover{text-decoration:underline}
.primary{
  width:100%;min-height:50px;margin-top:8px;border:0;border-radius:14px;
  background:var(--accent);color:var(--accent-contrast);cursor:pointer;font-weight:750;
  transition:transform 180ms ease,box-shadow 180ms ease;
}
.primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(0,0,0,.2)}
.primary:active{transform:translateY(0)}
.switch-copy{margin:42px 0 0;color:var(--muted);font-size:.82rem;line-height:1.5;text-align:center}
.switch{margin-left:4px;padding:0;border:0;background:none;color:var(--text);cursor:pointer;font:inherit;font-weight:750}
.switch:hover{text-decoration:underline}
.sr-status{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
@keyframes orbitOuter{
  from{transform:translate3d(0,0,0) rotate(0deg)}
  to{transform:translate3d(var(--outer-x,0px),var(--outer-y,0px),0) rotate(360deg)}
}
@keyframes orbitMiddle{
  from{transform:translate3d(0,0,0) rotate(0deg)}
  to{transform:translate3d(var(--middle-x,0px),var(--middle-y,0px),0) rotate(-360deg)}
}
@keyframes orbitInner{
  from{transform:translate3d(0,0,0) rotate(0deg)}
  to{transform:translate3d(var(--inner-x,0px),var(--inner-y,0px),0) rotate(360deg)}
}
@media(max-width:560px){
  body{padding:20px 14px}
  .halos{inset:-135px}
  .ring-outer{width:530px;height:530px;margin:-265px}
  .ring-middle{width:400px;height:400px;margin:-200px}
  .ring-inner{width:280px;height:280px;margin:-140px}
  .card{min-height:570px;padding:28px 22px}
}
@media(prefers-reduced-motion:reduce){
  .ring{animation:none!important;transform:none!important}
  .field input,.primary{transition:none}
}
</style>
</head>
<body>
<main class="page">
  <p class="lab-label">Animation Lab · Orbital Halo</p>
  <div class="scene" id="scene">
    <div class="halos" aria-hidden="true">
      <div class="ring ring-outer"></div>
      <div class="ring ring-middle"></div>
      <div class="ring ring-inner"></div>
    </div>

    <section class="card" aria-live="polite">
      <div class="content">
        <div class="brand-mark" aria-hidden="true">VT</div>
        <h1>Login</h1>
        <p class="subtitle">Sign in to continue to your account.</p>

        <form class="form" id="loginForm">
          <div class="field">
            <label for="loginEmail">Email address</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">✉</span>
              <input id="loginEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email">
            </div>
          </div>

          <div class="field">
            <label for="loginPassword">Password</label>
            <div class="input-wrap">
              <span class="input-icon" aria-hidden="true">●</span>
              <input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password">
            </div>
          </div>

          <div class="form-row">
            <label class="remember"><input id="rememberMe" type="checkbox">Remember me</label>
            <a href="#forgot-password">Forgot password?</a>
          </div>

          <button class="primary" type="submit">Sign In</button>
        </form>

        <p class="switch-copy">Don't have an account?<button class="switch" id="showSignup" type="button">Sign up</button></p>
      </div>
    </section>
  </div>

  <p class="sr-status" id="status" aria-live="polite">Login form is active.</p>
</main>

<script>
(()=>{
  const form=document.getElementById("loginForm");
  const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)");
  const rings=[
    {el:document.querySelector(".ring-outer"),x:"--outer-x",y:"--outer-y",sensitivity:1},
    {el:document.querySelector(".ring-middle"),x:"--middle-x",y:"--middle-y",sensitivity:.72},
    {el:document.querySelector(".ring-inner"),x:"--inner-x",y:"--inner-y",sensitivity:.48}
  ];
  let frame=null;

  function reset(){
    rings.forEach(ring=>{
      ring.el.style.setProperty(ring.x,"0px");
      ring.el.style.setProperty(ring.y,"0px");
    });
  }

  function parallax(event){
    if(reduceMotion.matches)return;
    const x=(event.clientX/window.innerWidth-.5)*12;
    const y=(event.clientY/window.innerHeight-.5)*12;

    rings.forEach(ring=>{
      ring.el.style.setProperty(ring.x,(-x*ring.sensitivity)+"px");
      ring.el.style.setProperty(ring.y,(-y*ring.sensitivity)+"px");
    });
  }

  window.addEventListener("mousemove",event=>{
    if(frame)return;
    frame=requestAnimationFrame(()=>{
      parallax(event);
      frame=null;
    });
  },{passive:true});

  window.addEventListener("mouseleave",reset);
  reduceMotion.addEventListener?.("change",event=>{if(event.matches)reset()});

  form.addEventListener("submit",event=>event.preventDefault());
})();
</script>
</body>
</html>
