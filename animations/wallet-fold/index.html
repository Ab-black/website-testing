<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Multi-axis spiral login and sign-up transition experiment.">
<title>Spiral Flip — Animation Lab</title>
<style>
:root{
  --bg:#0b0d10;--surface:#13171c;--raised:#1a1f26;--text:#f5f7fa;--muted:#9aa4b2;
  --border:rgba(255,255,255,.1);--accent:#fff;--accent-contrast:#0b0d10;
  --card:#f5f7fa;--card-soft:#eef1f4;--card-tint:#e9edf2;--card-text:#0b0d10;--card-muted:#66717f;
  --card-border:rgba(11,13,16,.1);--shadow:0 34px 90px rgba(0,0,0,.38),0 12px 30px rgba(0,0,0,.16);
  --radius:28px;--duration:1000ms;
}
*{box-sizing:border-box}
html{min-height:100%}
body{
  min-height:100vh;margin:0;display:grid;place-items:center;padding:32px 20px;
  background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.055),transparent 40%),var(--bg);
  color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input{font:inherit}
.page{width:min(100%,460px)}
.lab-label{margin:0 0 14px;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-align:center;text-transform:uppercase}
.scene{position:relative;width:100%;perspective:1500px}
.card{
  position:relative;width:100%;display:grid;transform-style:preserve-3d;
  transition:transform var(--duration) cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
.card.is-open{transform:rotateY(180deg)}
.face{
  grid-area:1/1;position:relative;min-width:0;padding:clamp(30px,7vw,40px);
  border:1px solid var(--card-border);border-radius:var(--radius);overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(233,237,242,.95)),var(--card);
  color:var(--card-text);box-shadow:var(--shadow);
}
.face:before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(145deg,rgba(255,255,255,.62),transparent 38%,rgba(11,13,16,.035));
}
.front{z-index:2}
.back{z-index:1;transform:rotateY(180deg)}
.content{position:relative;z-index:3}
.brand-mark{
  width:46px;height:46px;display:grid;place-items:center;margin-bottom:30px;
  border:1px solid var(--card-border);border-radius:14px;background:var(--card-tint);
  color:var(--card-text);font-size:.8rem;font-weight:800;letter-spacing:-.04em;
  box-shadow:0 10px 24px rgba(11,13,16,.08);
}
h1{margin:0 0 10px;font-size:clamp(2rem,7vw,2.55rem);line-height:1.05;letter-spacing:-.045em}
.subtitle{margin:0 0 30px;color:var(--card-muted);font-size:.95rem;line-height:1.6}
.form{display:grid;gap:16px}
.field{display:grid;gap:8px}
.field label{color:var(--card-muted);font-size:.68rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase}
.input-wrap{position:relative}
.input-icon{display:none}
.field input{
  width:100%;height:50px;padding:0 15px;border:1px solid rgba(11,13,16,.1);border-radius:14px;outline:none;
  background:linear-gradient(135deg,rgba(245,247,250,.96),rgba(233,237,242,.96));
  color:var(--card-text);box-shadow:inset 0 2px 8px rgba(11,13,16,.12),inset 0 1px 0 rgba(255,255,255,.8);
  transition:border-color 180ms ease,box-shadow 180ms ease,background 180ms ease;
}
.field input::placeholder{color:#7a8490}
.field input:focus{
  border-color:rgba(11,13,16,.24);background:linear-gradient(135deg,#f8f9fa,#e9edf2);
  box-shadow:inset 0 2px 8px rgba(11,13,16,.1),0 0 0 4px rgba(11,13,16,.045);
}
.form-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
.remember{display:inline-flex;align-items:center;gap:8px;color:var(--card-muted);font-size:.78rem;cursor:pointer}
.remember input{width:15px;height:15px;accent-color:var(--accent-contrast)}
a{color:var(--card-text);font-size:.78rem;font-weight:650;text-decoration:none}
a:hover{text-decoration:underline}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.action{
  min-height:50px;border-radius:999px;padding:0 18px;cursor:pointer;font-weight:750;
  transition:transform 180ms ease,box-shadow 180ms ease,background 180ms ease,border-color 180ms ease;
}
.action:hover{transform:translateY(-1px)}
.action:active{transform:translateY(0)}
.primary{border:1px solid var(--accent-contrast);background:var(--accent-contrast);color:var(--card);box-shadow:0 12px 28px rgba(11,13,16,.16)}
.primary:hover{box-shadow:0 15px 32px rgba(11,13,16,.22)}
.secondary{border:1px solid rgba(11,13,16,.22);background:rgba(255,255,255,.5);color:var(--card-text)}
.secondary:hover{background:rgba(255,255,255,.76);border-color:rgba(11,13,16,.34)}
.switch-copy{margin:24px 0 0;color:var(--card-muted);font-size:.82rem;line-height:1.5;text-align:center}
.switch{padding:0;border:0;background:none;color:var(--card-text);cursor:pointer;font:inherit;font-weight:750;position:relative;z-index:5}
.switch:hover{text-decoration:underline}
.status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.front,.back{pointer-events:none}
.card:not(.is-open) .front{pointer-events:auto}
.card.is-open .back{pointer-events:auto}

@keyframes spiral-forward{
  0%{transform:rotateY(0deg) translate3d(0,0,0) scale(1)}
  25%{transform:rotateY(45deg) translate3d(26px,-42px,0) scale(.93)}
  50%{transform:rotateY(90deg) translate3d(26px,-42px,0) scale(.93)}
  75%{transform:rotateY(135deg) translate3d(12px,-18px,0) scale(.965)}
  100%{transform:rotateY(180deg) translate3d(0,0,0) scale(1)}
}
@keyframes spiral-reverse{
  0%{transform:rotateY(180deg) translate3d(0,0,0) scale(1)}
  25%{transform:rotateY(135deg) translate3d(12px,-18px,0) scale(.965)}
  50%{transform:rotateY(90deg) translate3d(26px,-42px,0) scale(.93)}
  75%{transform:rotateY(45deg) translate3d(26px,-42px,0) scale(.93)}
  100%{transform:rotateY(0deg) translate3d(0,0,0) scale(1)}
}
.card.is-animating-forward{animation:spiral-forward var(--duration) cubic-bezier(.4,0,.2,1) both}
.card.is-animating-reverse{animation:spiral-reverse var(--duration) cubic-bezier(.4,0,.2,1) both}
.card.is-animating-forward,.card.is-animating-reverse{transition:none}

@media(max-width:480px){
  body{padding:20px 14px}
  .face{padding:28px 22px}
  .action-row{gap:8px}
  .action{padding:0 12px;font-size:.88rem}
}
@media(prefers-reduced-motion:reduce){
  .card{transition:none}
  .card.is-animating-forward,.card.is-animating-reverse{animation:none}
  .action{transition:none}
  .field input{transition:none}
}
</style>
</head>
<body>
<main class="page">
<p class="lab-label">Animation Lab · Spiral Flip</p>
<div class="scene">
<section class="card" id="card" aria-live="polite">
  <div class="face front">
    <div class="content">
      <div class="brand-mark" aria-hidden="true">VT</div>
      <h1>Login</h1>
      <p class="subtitle">Sign in to continue to your account.</p>
      <form class="form" id="loginForm">
        <div class="field"><label for="loginEmail">Email address</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">✉</span><input id="loginEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email"></div></div>
        <div class="field"><label for="loginPassword">Password</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password"></div></div>
        <div class="form-row"><label class="remember"><input id="rememberMe" type="checkbox">Remember me</label><a href="#forgot-password">Forgot password?</a></div>
        <div class="action-row">
          <button class="action primary" type="submit">Sign In</button>
          <button class="action secondary" id="showSignup" type="button">Create Account</button>
        </div>
      </form>
      <p class="switch-copy">New here? Use Create Account above.</p>
    </div>
  </div>

  <div class="face back">
    <div class="content">
      <div class="brand-mark" aria-hidden="true">VT</div>
      <h1>Sign up</h1>
      <p class="subtitle">Create your account and get started.</p>
      <form class="form" id="signupForm">
        <div class="field"><label for="signupName">Full name</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="signupName" name="name" type="text" placeholder="Your full name" autocomplete="name"></div></div>
        <div class="field"><label for="signupEmail">Email address</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">✉</span><input id="signupEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email"></div></div>
        <div class="field"><label for="signupPassword">Password</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="signupPassword" name="password" type="password" placeholder="Create a password" autocomplete="new-password"></div></div>
        <div class="action-row">
          <button class="action primary" type="submit">Create Account</button>
          <button class="action secondary" id="showLogin" type="button">Log In</button>
        </div>
      </form>
      <p class="switch-copy">Already have an account? Use Log In above.</p>
    </div>
  </div>
</section>
</div>
<p class="status" id="status" aria-live="polite">Login form is active.</p>
</main>
<script>
(()=>{
  const card=document.getElementById("card");
  const showSignup=document.getElementById("showSignup");
  const showLogin=document.getElementById("showLogin");
  const status=document.getElementById("status");
  const loginForm=document.getElementById("loginForm");
  const signupForm=document.getElementById("signupForm");
  const reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)");
  let isSignUpVisible=false;
  let isAnimating=false;

  function render(){
    card.classList.toggle("is-open",isSignUpVisible);
    status.textContent=isSignUpVisible?"Sign-up form is active.":"Login form is active.";
  }

  function setAuthSide(next){
    if(isAnimating && next===isSignUpVisible)return;
    isSignUpVisible=next;
    render();

    if(reducedMotion.matches){
      card.classList.remove("is-animating-forward","is-animating-reverse");
      return;
    }

    isAnimating=true;
    card.classList.remove("is-animating-forward","is-animating-reverse");
    void card.offsetWidth;
    card.classList.add(isSignUpVisible?"is-animating-forward":"is-animating-reverse");
  }

  card.addEventListener("animationend",event=>{
    if(event.animationName!=="spiral-forward"&&event.animationName!=="spiral-reverse")return;
    card.classList.remove("is-animating-forward","is-animating-reverse");
    isAnimating=false;
    render();
  });

  showSignup.addEventListener("click",()=>setAuthSide(true));
  showLogin.addEventListener("click",()=>setAuthSide(false));
  loginForm.addEventListener("submit",e=>e.preventDefault());
  signupForm.addEventListener("submit",e=>e.preventDefault());
})();
</script>
</body>
</html>
