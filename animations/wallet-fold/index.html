<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Pedestal coin-flip login and sign-up animation experiment.">
<title>Pedestal Flip — Animation Lab</title>
<style>
:root{
  --bg:#0b0d10;--surface:#13171c;--raised:#1a1f26;--text:#f5f7fa;--muted:#9aa4b2;
  --border:rgba(255,255,255,.1);--accent:#fff;--accent-contrast:#0b0d10;
  --shadow:0 30px 80px rgba(0,0,0,.42);--radius:24px;--duration:900ms;
}
*{box-sizing:border-box}
html{min-height:100%}
body{
  min-height:100vh;margin:0;display:grid;place-items:center;padding:32px 20px;
  background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.055),transparent 40%),var(--bg);
  color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input{font:inherit}
.page{width:min(100%,460px)}
.lab-label{margin:0 0 18px;color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-align:center;text-transform:uppercase}
.stage{position:relative;width:100%;padding:0 0 34px;perspective:1500px}
.pedestal{
  position:absolute;z-index:0;left:8%;right:8%;bottom:0;height:48px;border-radius:50%;
  background:rgba(19,23,28,.9);
  box-shadow:0 20px 35px rgba(0,0,0,.48);
  transform:translateY(6px) scale(1);
  transform-origin:center;
  transition:transform var(--duration) cubic-bezier(.34,1.56,.64,1),opacity var(--duration) ease-in-out;
  pointer-events:none;
}
.pedestal:after{
  content:"";position:absolute;inset:7px 12%;border-radius:50%;
  background:rgba(11,13,16,.7);filter:blur(7px);pointer-events:none;
}
.stage.is-turning .pedestal{animation:pedestal-settle var(--duration) both cubic-bezier(.34,1.56,.64,1)}
.stage.is-open .pedestal{transform:translateY(6px) scale(1);opacity:1}
@keyframes pedestal-settle{
  0%{transform:translateY(6px) scale(1);opacity:1}
  48%{transform:translateY(9px) scale(.72);opacity:.48}
  72%{transform:translateY(6px) scale(1.04);opacity:.9}
  100%{transform:translateY(6px) scale(1);opacity:1}
}
.card-wrap{position:relative;z-index:2;width:100%;perspective:inherit}
.card{
  position:relative;width:100%;display:grid;transform-style:preserve-3d;
  transition:transform var(--duration) cubic-bezier(.34,1.56,.64,1);
}
.face{
  grid-area:1/1;position:relative;min-width:0;padding:clamp(28px,7vw,40px);
  border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.front{z-index:2;background:linear-gradient(145deg,rgba(255,255,255,.05),transparent 42%),var(--surface);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.045)}
.back{z-index:1;transform:rotateY(180deg);background:linear-gradient(145deg,rgba(255,255,255,.05),transparent 42%),var(--surface);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.045)}
.card.is-open{transform:rotateY(180deg)}
.content{position:relative;z-index:2}
.brand-mark{width:46px;height:46px;display:grid;place-items:center;margin-bottom:30px;border:1px solid var(--border);border-radius:14px;background:var(--raised);color:var(--text);font-size:.8rem;font-weight:800;letter-spacing:-.04em}
h1{margin:0 0 10px;font-size:clamp(2rem,7vw,2.55rem);line-height:1.05;letter-spacing:-.045em}
.subtitle{margin:0 0 30px;color:var(--muted);font-size:.95rem;line-height:1.6}
.form{display:grid;gap:16px}
.field{display:grid;gap:8px}
.field label{color:var(--text);font-size:.78rem;font-weight:650}
.input-wrap{position:relative}
.input-icon{position:absolute;top:50%;left:15px;width:18px;height:18px;display:grid;place-items:center;color:var(--muted);font-size:.88rem;pointer-events:none;transform:translateY(-50%)}
.field input{width:100%;height:50px;padding:0 15px 0 44px;border:1px solid var(--border);border-radius:14px;outline:none;background:rgba(255,255,255,.035);color:var(--text);transition:border-color 180ms ease,background 180ms ease,box-shadow 180ms ease}
.field input::placeholder{color:#6f7987}
.field input:focus{border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.055);box-shadow:0 0 0 4px rgba(255,255,255,.055)}
.form-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
.remember{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.78rem;cursor:pointer}
.remember input{width:15px;height:15px;accent-color:var(--accent)}
a{color:var(--text);font-size:.78rem;font-weight:650;text-decoration:none}
a:hover{text-decoration:underline}
.primary{width:100%;min-height:50px;margin-top:8px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-contrast);cursor:pointer;font-weight:750;transition:transform 180ms ease,box-shadow 180ms ease}
.primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(0,0,0,.2)}
.primary:active{transform:translateY(0)}
.switch-copy{margin:34px 0 0;color:var(--muted);font-size:.82rem;line-height:1.5;text-align:center}
.switch{margin-left:4px;padding:0;border:0;background:none;color:var(--text);cursor:pointer;font:inherit;font-weight:750}
.switch:hover{text-decoration:underline}
.status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:480px){
  body{padding:20px 14px}
  .face{padding:28px 22px}
  .pedestal{left:10%;right:10%;height:42px}
}
@media(prefers-reduced-motion:reduce){
  .card,.pedestal{transition-duration:1ms}
  .stage.is-turning .pedestal{animation:none}
  .field input,.primary{transition:none}
}
</style>
</head>
<body>
<main class="page">
<p class="lab-label">Animation Lab · Pedestal Flip</p>
<div class="stage" id="stage">
  <div class="pedestal" aria-hidden="true"></div>
  <div class="card-wrap">
    <section class="card" id="card" aria-live="polite">
      <div class="face front">
        <div class="content">
          <div class="brand-mark" aria-hidden="true">VT</div>
          <h1>Login</h1>
          <p class="subtitle">Sign in to continue to your account.</p>
          <form class="form" id="loginForm">
            <div class="field"><label for="loginEmail">Email address</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">✉</span><input id="loginEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email"></div></div>
            <div class="field"><label for="loginPassword">Password</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password"></div></div>
            <div class="form-row"><label class="remember"><input id="rememberMe" type="checkbox">Remember me</label><a href="#forgot-password">Forgot password?</a></div>
            <button class="primary" type="submit">Sign In</button>
          </form>
          <p class="switch-copy">Don't have an account?<button class="switch" id="showSignup" type="button">Sign up</button></p>
        </div>
      </div>
      <div class="face back">
        <div class="content">
          <div class="brand-mark" aria-hidden="true">VT</div>
          <h1>Sign up</h1>
          <p class="subtitle">Create your account and get started.</p>
          <form class="form" id="signupForm">
            <div class="field"><label for="signupName">Full name</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="signupName" name="name" type="text" placeholder="Your full name" autocomplete="name"></div></div>
            <div class="field"><label for="signupEmail">Email address</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">✉</span><input id="signupEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email"></div></div>
            <div class="field"><label for="signupPassword">Password</label><div class="input-wrap"><span class="input-icon" aria-hidden="true">●</span><input id="signupPassword" name="password" type="password" placeholder="Create a password" autocomplete="new-password"></div></div>
            <button class="primary" type="submit">Sign Up</button>
          </form>
          <p class="switch-copy">Already have an account?<button class="switch" id="showLogin" type="button">Log in</button></p>
        </div>
      </div>
    </section>
  </div>
</div>
<p class="status" id="status" aria-live="polite">Login form is active.</p>
</main>
<script>
(()=> {
  const stage=document.getElementById("stage"), card=document.getElementById("card");
  const showSignup=document.getElementById("showSignup"), showLogin=document.getElementById("showLogin");
  const status=document.getElementById("status"), loginForm=document.getElementById("loginForm"), signupForm=document.getElementById("signupForm");
  const duration=900; let isSignUpVisible=false; let isTurning=false;

  function toggleCard(){
    if(isTurning)return;
    isSignUpVisible=!isSignUpVisible;
    isTurning=true;
    stage.classList.add("is-turning");
    card.classList.toggle("is-open",isSignUpVisible);
    status.textContent=isSignUpVisible?"Sign-up form is active.":"Login form is active.";
  }

  card.addEventListener("transitionend",event=>{
    if(event.propertyName==="transform"){
      stage.classList.remove("is-turning");
      isTurning=false;
      card.style.transform="";
    }
  });

  showSignup.addEventListener("click",toggleCard);
  showLogin.addEventListener("click",toggleCard);
  loginForm.addEventListener("submit",e=>e.preventDefault());
  signupForm.addEventListener("submit",e=>e.preventDefault());

  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    card.style.transition="none";
  }
})();
</script>
</body>
</html>
